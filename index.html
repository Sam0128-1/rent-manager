function generateRoomCanvas(key){
  const room=state.rooms[key];const[b,num]=key.split('-');
  const bld=getBuilding(b);const bName=bld?bld.name:(b+'栋');
  const months=Object.keys(room.months).sort((a,b)=>{const aU=!room.months[a].paid?0:1;const bU=!room.months[b].paid?0:1;if(aU!==bU)return aU-bU;return b.localeCompare(a);});
  if(months.length===0)return null;
  const canvas=document.createElement('canvas');
  const W=600,rowH=50,headerH=140,footerH=40;
  const monthCount=Math.min(months.length,12);
  canvas.width=W;canvas.height=headerH+monthCount*rowH+footerH+30;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
  const grad=ctx.createLinearGradient(0,0,W,0);grad.addColorStop(0,'#5C6DFF');grad.addColorStop(1,'#4B5BF0');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,90);
  ctx.fillStyle='#ffffff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
  const tenantName=room.tenant||'未命名';
  ctx.fillText(`${bName} ${num}房 ${tenantName}`,W/2,38);
  ctx.font='13px sans-serif';ctx.fillStyle='rgba(255,255,255,.85)';
  const now=new Date();
  ctx.fillText(`水电费明细 · 电话：${room.phone||'-'}  ${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,W/2,66);
  ctx.fillStyle='#f1f5f9';ctx.fillRect(0,90,W,50);
  ctx.fillStyle='#1e293b';ctx.font='bold 13px sans-serif';
  [{l:'月份',x:50},{l:'租金',x:130},{l:'用水(方)',x:200},{l:'水费',x:275},{l:'用电(度)',x:345},{l:'电费',x:420},{l:'扣除',x:485},{l:'合计',x:550}].forEach(c=>ctx.fillText(c.l,c.x,120));
  ctx.strokeStyle='#e2e8f0';ctx.beginPath();ctx.moveTo(0,140);ctx.lineTo(W,140);ctx.stroke();
  ctx.font='12px sans-serif';
  months.slice(0,monthCount).forEach((ym,i)=>{
    const md=room.months[ym];const calc=calcMonthFee(room,md);const y=140+(i+1)*rowH-18;
    if(i%2===1){ctx.fillStyle='#f8fafc';ctx.fillRect(0,140+i*rowH,W,rowH);}
    ctx.fillStyle='#1e293b';ctx.fillText(formatYM(ym),50,y);ctx.fillText(money(calc.rent),130,y);
    ctx.fillText(calc.waterUsed>0?calc.waterUsed.toFixed(1):'-',200,y);ctx.fillText(money(calc.waterFee),275,y);
    ctx.fillText(calc.elecUsed>0?calc.elecUsed.toFixed(1):'-',345,y);ctx.fillText(money(calc.elecFee),420,y);
    ctx.fillStyle='#e6a700';ctx.fillText(calc.deduction>0?'-'+money(calc.deduction):'-',485,y);
    ctx.fillStyle='#ef4444';ctx.font='bold 13px sans-serif';ctx.fillText(money(calc.total),550,y);ctx.font='12px sans-serif';
  });
  let totalAll=0;months.forEach(ym=>totalAll+=calcMonthFee(room,room.months[ym]).total);
  ctx.fillStyle='#f8fafc';ctx.fillRect(0,140+monthCount*rowH,W,40);
  ctx.fillStyle='#1e293b';ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.fillText(`共计 ${months.length} 个月记录`,20,140+monthCount*rowH+25);
  ctx.textAlign='right';ctx.fillStyle='#ef4444';ctx.fillText(`累计合计：${money(totalAll)}`,W-20,140+monthCount*rowH+25);
  return canvas;
}

async function doBatchExport(b,selMonths,selRooms,fmt){
  const bName=b.name||(b.id+'栋');
  if(fmt==='image'){
    // 所有房间画在一张高清大图上，纵向排列
    const dpr=3; // 高清：3倍像素密度
    const W=520*dpr,cardH=200*dpr,gap=10*dpr;
    const totalCards=selRooms.length*selMonths.length;
    const totalH=totalCards*cardH+(totalCards-1)*gap;
    const canvas=document.createElement('canvas');
    canvas.width=W;canvas.height=Math.max(totalH,cardH);
    const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
    const wLogic=W/dpr,hCard=cardH/dpr,gGap=gap/dpr;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,wLogic,canvas.height/dpr);
    let idx=0;
    for(const item of selRooms){
      const{key,room}=item;const num2=key.split('-')[1];
      for(const ym of selMonths){
        const md=room.months[ym];const calc=md?calcMonthFee(room,md):{rent:0,waterUsed:0,waterFee:0,elecUsed:0,elecFee:0,deduction:0,total:0};
        const rates=getRoomRates(room);const dispStatus=getRoomDisplayStatus(room);
        const statusText=dispStatus==='empty'?'空置':(dispStatus==='unpaid'?'未缴':(dispStatus==='occupied'?'已缴':'未缴'));
        const tenantName=room.tenant||'空置';
        const yOff=idx*(hCard+gGap);
        // 卡片背景
        ctx.fillStyle='#fff';ctx.fillRect(0,yOff,wLogic,hCard);
        // 标题栏（蓝色渐变）
        const grad=ctx.createLinearGradient(0,yOff,wLogic,yOff);grad.addColorStop(0,'#5C6DFF');grad.addColorStop(1,'#4B5BF0');
        ctx.fillStyle=grad;ctx.fillRect(0,yOff,wLogic,48);
        ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='left';
        ctx.fillText(`${bName} ${num2}房 ${tenantName}`,14,yOff+32);
        ctx.font='14px sans-serif';ctx.textAlign='right';
        ctx.fillText(formatYM(ym),wLogic-14,yOff+32);
        // 费用明细
        ctx.font='14px sans-serif';
        [{l:'月租金',v:money(calc.rent),y:yOff+72},{l:'水费 ('+calc.waterUsed+'方 × ¥'+rates.waterPrice+')',v:money(calc.waterFee),y:yOff+96},{l:'电费 ('+calc.elecUsed+'度 × ¥'+rates.electricPrice+')',v:money(calc.elecFee),y:yOff+120}].forEach(d=>{ctx.fillStyle='#64748b';ctx.textAlign='left';ctx.fillText(d.l,14,d.y);ctx.fillStyle='#1e293b';ctx.textAlign='right';ctx.fillText(d.v,wLogic-14,d.y);});
        // 合计行
        ctx.fillStyle='#f8fafc';ctx.fillRect(0,yOff+140,wLogic,44);
        ctx.fillStyle='#1e293b';ctx.font='bold 16px sans-serif';ctx.textAlign='left';ctx.fillText('合计应收',14,yOff+170);
        ctx.fillStyle='#ef4444';ctx.font='bold 20px sans-serif';ctx.textAlign='right';ctx.fillText(money(calc.total),wLogic-14,yOff+170);
        // 状态
        const sc=statusText==='未缴'?'#ef4444':(statusText==='已缴'?'#22c55e':'#94a3b8');
        ctx.fillStyle=sc;ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText('状态：'+statusText,14,yOff+192);
        idx++;
      }
    }
    const filename=`${bName}_费用明细_${selMonths[0]}${selMonths.length>1?'-'+selMonths[selMonths.length-1]:''}.png`;
    canvas.toBlob(async(blob)=>{
      const shared=await shareFile(blob,filename,'image/png',`${bName} 费用明细`);
      closeBatchExport();
      toast(shared?'已分享/保存':'文件已下载');
    },'image/png');
  }else{
    // CSV
    let csv='\uFEFF';
    csv+=`${bName} 费用明细\n`;
    csv+=`导出时间,${new Date().toISOString().slice(0,10)}\n\n`;
    csv+='房间号,租客,月份,月租金,用水量(方),水费,用电量(度),电费,扣除项,合计,缴费状态,备注\n';
    selRooms.forEach(item=>{
      const{key,room}=item;const num2=key.split('-')[1];
      selMonths.forEach(ym=>{
        const md=room.months[ym];
        if(md){const c=calcMonthFee(room,md);csv+=[num2,room.tenant||'',formatYM(ym),c.rent.toFixed(2),c.waterUsed.toFixed(1),c.waterFee.toFixed(2),c.elecUsed.toFixed(1),c.elecFee.toFixed(2),c.deduction.toFixed(2),c.total.toFixed(2),md.paid?'已缴费':'未缴费',md.note||''].join(',')+'\n';}
      });
    });

    shareFile(blob,filename,'text/csv',`${bName} 费用明细`).then(shared=>{
      closeBatchExport();
      toast(shared?'已分享/保存':'文件已下载');
    });
  }
}

// CSV 表头定义（顺序固定）
const CSV_HEADERS=[
  '楼栋名称','楼层','房间号','租客姓名','电话','身份证号','入住日期',
  '固定月租金','押金金额','押金方式','费用月份','月租金',
  '上月水表','本月水表','上月电表','本月电表','缴费状态','备注','水费单价','电费单价'
];
// 转义 CSV 单元格（含逗号/引号/换行时加引号转义）
function csvCell(v){
  const s=String(v==null?'':v);
  if(/[",\n\r]/.test(s))return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function csvRow(arr){return arr.map(csvCell).join(',')+'\n';}

// 导出当前 state 为 CSV
function exportStateAsCSV(){
  let csv='\uFEFF';
  csv+=csvRow(CSV_HEADERS);
  state.buildings.forEach(b=>{

        const room=state.rooms[key];

        }else{

          });
        }
      }
    });
  });
  csv+='\n';
  csv+=csvRow(['#全局配置','','','','','','','','','','','','','','','','','','','']);
  csv+=csvRow(['globalRates.waterPrice','','','','','','','','','','','','','','','','','','',state.globalRates.waterPrice]);
  csv+=csvRow(['globalRates.electricPrice','','','','','','','','','','','','','','','','','','',state.globalRates.electricPrice]);

// 简易 CSV 解析（支持引号转义、逗号分隔、换行）
function parseCSV(text){
  const rows=[];let row=[];let cell='';let inQuote=false;
  text=text.replace(/^\uFEFF/,''); // 去 BOM
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQuote){
      if(ch==='"'){
        if(text[i+1]==='"'){cell+='"';i++;}
        else{inQuote=false;}
      }else{cell+=ch;}
    }else{
      if(ch==='"'){inQuote=true;}
      else if(ch===','){row.push(cell);cell='';}
      else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else if(ch==='\r'){/* skip */}
      else{cell+=ch;}
    }
  }
  if(cell!==''||row.length>0){row.push(cell);rows.push(row);}
  return rows;
}

// 从 CSV 文本导入到 state（合并，不覆盖已有数据）
function importStateFromCSV(text){
  const rows=parseCSV(text);
  if(rows.length<2)return{success:false,message:'CSV文件为空或格式不正确'};
  // 找表头行（兼容新旧格式：新格式无"楼栋ID"，旧格式有）
  let headerIdx=-1;
  for(let i=0;i<Math.min(rows.length,5);i++){
    if(rows[i].includes('楼栋名称')&&rows[i].includes('房间号')){headerIdx=i;break;}
    if(rows[i].includes('楼栋ID')&&rows[i].includes('房间号')){headerIdx=i;break;}
  }
  if(headerIdx<0)return{success:false,message:'未找到CSV表头（需含楼栋名称、房间号等列）'};
  const header=rows[headerIdx];
  const colMap={};
  header.forEach((h,i)=>{colMap[h.trim()]=i;});
  // 必须包含的列：楼栋名称、楼层、房间号
  const need=['楼栋名称','楼层','房间号'];
  for(const k of need){if(colMap[k]===undefined)return{success:false,message:'CSV缺少必要列：'+k};}

  const get=(row,key)=>{const idx=colMap[key];return idx===undefined?'':(row[idx]||'').trim();};
  // 解析楼栋名称为楼栋ID（自动匹配或创建）
  function getOrCreateBuilding(bname){
    if(!bname)return null;
    // 先按名称匹配
    let b=state.buildings.find(x=>x.name===bname);
    if(b)return b;
    // 再按ID匹配（兼容旧格式中楼栋名称可能就是ID）
    b=state.buildings.find(x=>x.id===bname);
    if(b)return b;
    // 创建新楼栋，ID用名称第一个字符或递增字母
    let newId=bname.charAt(0).toUpperCase();
    // 确保ID不重复
    let suffix=1;
    while(state.buildings.find(x=>x.id===newId)){
      newId=bname.charAt(0).toUpperCase()+suffix;
      suffix++;
    }
    b={id:newId,name:bname,floors:[]};
    state.buildings.push(b);
    return b;
  }

  let buildingCount=0,roomCount=0,monthCount=0;
  for(let i=headerIdx+1;i<rows.length;i++){
    const row=rows[i];
    if(!row||row.length<3)continue;
    const firstCell=(row[0]||'').trim();
    if(!firstCell||firstCell.startsWith('#')||firstCell.startsWith('说明')||firstCell.startsWith('globalRates'))continue;

    const bname=get(row,'楼栋名称');
    // 兼容旧格式：如果有楼栋ID列，优先用楼栋ID
    const bidOld=colMap['楼栋ID']!==undefined?get(row,'楼栋ID'):'';
    const fIdx=parseInt(get(row,'楼层'))-1;
    const num2=parseInt(get(row,'房间号'));
    if(isNaN(fIdx)||isNaN(num2))continue;

    // 确定楼栋
    let b;
    if(bidOld){
      b=state.buildings.find(x=>x.id===bidOld);
      if(!b){b={id:bidOld,name:bname||bidOld+'栋',floors:[]};state.buildings.push(b);buildingCount++;}
      else if(bname&&!b.name){b.name=bname;}
    }else if(bname){
      b=getOrCreateBuilding(bname);
      if(!b)continue;
      // 检查是否是新建的
      if(state.buildings.indexOf(b)===state.buildings.length-1&&b.floors.length===0){buildingCount++;}
    }else continue;

    // 确保楼层存在
    while(b.floors.length<fIdx+1){b.floors.push({rooms:5});}
    const floor=b.floors[fIdx];
    const roomNum=num2%100;
    if(floor.rooms<roomNum)floor.rooms=roomNum;

    // 生成房间 key
    const key=`${b.id}-${num2}`;
    if(!state.rooms[key]){state.rooms[key]=defaultRoom();roomCount++;}
    const room=state.rooms[key];
    // 更新房间信息（有值才更新，不覆盖已有数据）
    const tenant=get(row,'租客姓名');if(tenant)room.tenant=tenant;
    const phone=get(row,'电话');if(phone)room.phone=phone;
    const idCard=get(row,'身份证号');if(idCard)room.idCard=idCard;
    const moveIn=get(row,'入住日期');if(moveIn)room.moveInDate=moveIn;
    // 房间状态已去掉，有租客自动设为已入住
    if(room.tenant&&room.status==='empty')room.status='occupied';
    const fixedRent=get(row,'固定月租金');if(fixedRent)room.fixedRent=fixedRent;
    const depAmt=get(row,'押金金额');if(depAmt)room.deposit.amount=depAmt;
    const depMtd=get(row,'押金方式');if(depMtd)room.deposit.method=depMtd;
    const wp=get(row,'水费单价');if(wp)room.roomRates.waterPrice=wp;
    const ep=get(row,'电费单价');if(ep)room.roomRates.electricPrice=ep;
    const note=get(row,'备注');if(note)room.note=note;
    // 费用记录
    const ym=get(row,'费用月份');
    if(ym){
      // 自动识别各种年月格式：2024-01, 2024/01, 2024年1月, 20241
      let normalizedYm=ym;
      // 处理"2024年1月"格式
      const cnMatch=ym.match(/(\d{4})年(\d{1,2})月?/);
      if(cnMatch){normalizedYm=cnMatch[1]+'-'+cnMatch[2].padStart(2,'0');}
      // 处理"2024/01"格式
      else if(ym.includes('/')){const[y,m]=ym.split('/');normalizedYm=y+'-'+m.padStart(2,'0');}
      // 处理"2024-1"格式（补零）
      else if(ym.includes('-')){const[y,m]=ym.split('-');normalizedYm=y+'-'+m.padStart(2,'0');}
      const md={rent:get(row,'月租金'),waterPrev:get(row,'上月水表'),waterCurr:get(row,'本月水表'),electricPrev:get(row,'上月电表'),electricCurr:get(row,'本月电表'),paid:get(row,'缴费状态')==='已缴费',note:get(row,'备注')||''};
      room.months[normalizedYm]=md;monthCount++;
      if(room.status==='empty')room.status='occupied';
    }
  }
  // 解析全局配置（兼容新旧列数）
  for(let i=headerIdx+1;i<rows.length;i++){
    const row=rows[i];
    if(!row||!row[0])continue;
    if(row[0]==='globalRates.waterPrice'){
      // 找最后一列有值的
      for(let j=row.length-1;j>=0;j--){if(row[j]&&row[j].trim()){state.globalRates.waterPrice=num(row[j]);break;}}
    }
    if(row[0]==='globalRates.electricPrice'){
      for(let j=row.length-1;j>=0;j--){if(row[j]&&row[j].trim()){state.globalRates.electricPrice=num(row[j]);break;}}
    }
  }
  return{success:true,buildingCount,roomCount,monthCount};
}

// 解析 CSV 到临时数据（不写入 state），用于核对界面
function parseCSVForReview(text){
  const rows=parseCSV(text);
  if(rows.length<2)return{success:false,message:'CSV文件为空或格式不正确'};
  let headerIdx=-1;
  for(let i=0;i<Math.min(rows.length,5);i++){
    if(rows[i].includes('楼栋名称')&&rows[i].includes('房间号')){headerIdx=i;break;}
    if(rows[i].includes('楼栋ID')&&rows[i].includes('房间号')){headerIdx=i;break;}
  }
  if(headerIdx<0)return{success:false,message:'未找到CSV表头（需含楼栋名称、房间号等列）'};
  const header=rows[headerIdx];
  const colMap={};
  header.forEach((h,i)=>{colMap[h.trim()]=i;});
  const need=['楼栋名称','楼层','房间号'];
  for(const k of need){if(colMap[k]===undefined)return{success:false,message:'CSV缺少必要列：'+k};}
  const get=(row,key)=>{const idx=colMap[key];return idx===undefined?'':(row[idx]||'').trim();};

  const reviewData=[]; // 每行一个对象
  for(let i=headerIdx+1;i<rows.length;i++){
    const row=rows[i];
    if(!row||row.length<3)continue;
    const firstCell=(row[0]||'').trim();
    if(!firstCell||firstCell.startsWith('#')||firstCell.startsWith('说明')||firstCell.startsWith('globalRates'))continue;
    const bname=get(row,'楼栋名称');
    const fIdx=parseInt(get(row,'楼层'));
    const num2=parseInt(get(row,'房间号'));
    if(isNaN(fIdx)||isNaN(num2))continue;
    const ym=get(row,'费用月份');
    let normalizedYm=ym;
    if(ym){
      const cnMatch=ym.match(/(\d{4})年(\d{1,2})月?/);
      if(cnMatch){normalizedYm=cnMatch[1]+'-'+cnMatch[2].padStart(2,'0');}
      else if(ym.includes('/')){const[y,m]=ym.split('/');normalizedYm=y+'-'+m.padStart(2,'0');}
      else if(ym.includes('-')){const[y,m]=ym.split('-');normalizedYm=y+'-'+m.padStart(2,'0');}
    }
    reviewData.push({
      bname:bname,
      floor:fIdx,
      roomNum:num2,
      tenant:get(row,'租客姓名'),
      phone:get(row,'电话'),
      idCard:get(row,'身份证号'),
      moveIn:get(row,'入住日期'),
      fixedRent:get(row,'固定月租金'),
      depAmt:get(row,'押金金额'),
      depMtd:get(row,'押金方式'),
      ym:normalizedYm,
      rent:get(row,'月租金'),
      waterPrev:get(row,'上月水表'),
      waterCurr:get(row,'本月水表'),
      elecPrev:get(row,'上月电表'),
      elecCurr:get(row,'本月电表'),
      paid:get(row,'缴费状态'),
      note:get(row,'备注')
    });
  }
  return{success:true,data:reviewData};
}

// 将核对后的数据应用到 state
function applyImportedData(data){
  let buildingCount=0,roomCount=0,monthCount=0;
  function getOrCreateBuilding(bname){
    let b=state.buildings.find(x=>x.name===bname);
    if(b)return b;
    b=state.buildings.find(x=>x.id===bname);
    if(b)return b;
    let newId=bname.charAt(0).toUpperCase();
    let suffix=1;
    while(state.buildings.find(x=>x.id===newId)){newId=bname.charAt(0).toUpperCase()+suffix;suffix++;}
    b={id:newId,name:bname,floors:[]};
    state.buildings.push(b);buildingCount++;
    return b;
  }
  data.forEach(r=>{
    const b=getOrCreateBuilding(r.bname);
    const fIdx=r.floor-1;
    while(b.floors.length<fIdx+1){b.floors.push({rooms:5});}
    const floor=b.floors[fIdx];
    const roomNum=r.roomNum%100;
    if(floor.rooms<roomNum)floor.rooms=roomNum;
    const key=`${b.id}-${r.roomNum}`;
    if(!state.rooms[key]){state.rooms[key]=defaultRoom();roomCount++;}
    const room=state.rooms[key];
    if(r.tenant)room.tenant=r.tenant;
    if(r.phone)room.phone=r.phone;
    if(r.idCard)room.idCard=r.idCard;
    if(r.moveIn)room.moveInDate=r.moveIn;
    if(room.tenant&&room.status==='empty')room.status='occupied';
    if(r.fixedRent)room.fixedRent=r.fixedRent;
    if(r.depAmt)room.deposit.amount=r.depAmt;
    if(r.depMtd)room.deposit.method=r.depMtd;
    if(r.note)room.note=r.note;
    if(r.ym){
      room.months[r.ym]={rent:r.rent,waterPrev:r.waterPrev,waterCurr:r.waterCurr,electricPrev:r.elecPrev,electricCurr:r.elecCurr,paid:r.paid==='已缴费',note:r.note||''};
      monthCount++;
      if(room.status==='empty')room.status='occupied';
    }
  });
  initRooms();save();renderAll();closeSheet();
  toast(`导入成功：${buildingCount}栋、${roomCount}间房、${monthCount}条费用`);
}

          const data=JSON.parse(text);

    document.getElementById('clearDataModal').classList.add('show');

        confirmBtn.textContent=`请等待 ${countdown} 秒`;
      }else{
        clearInterval(clearCountdownTimer);clearCountdownTimer=null;
        confirmBtn.textContent='确认清空';

          confirmBtn.disabled=false;confirmBtn.style.opacity='1';

        }
      }
    },1000);
  });
  document.getElementById('clearConfirmInput').addEventListener('input',()=>{
    const confirmBtn=document.getElementById('clearConfirmBtn');
    const v=document.getElementById('clearConfirmInput').value;
    if(!clearCountdownTimer){
      if(v==='本人确定清空所有数据'){confirmBtn.disabled=false;confirmBtn.style.opacity='1';}
      else{confirmBtn.disabled=true;confirmBtn.style.opacity='.5';}
    }
  });
  document.getElementById('clearConfirmBtn').addEventListener('click',()=>{
    if(document.getElementById('clearConfirmInput').value!=='本人确定清空所有数据'){toast('请输入正确的确认文字');return;}
    if(document.getElementById('clearConfirmBtn').disabled)return;
    if(clearCountdownTimer){clearInterval(clearCountdownTimer);clearCountdownTimer=null;}

    state={current:'A',buildings:[{id:'A',name:'A栋',floors:[{rooms:5},{rooms:5},{rooms:5},{rooms:5},{rooms:5}]},{id:'B',name:'B栋',floors:[{rooms:5},{rooms:5},{rooms:5},{rooms:5},{rooms:5}]}],globalRates:{waterPrice:6,electricPrice:1.2},rooms:{},expenses:[]};

    document.getElementById('clearDataModal').classList.remove('show');
    toast('已清空所有数据');
  });
  document.getElementById('clearCancelBtn').addEventListener('click',()=>{
    if(clearCountdownTimer){clearInterval(clearCountdownTimer);clearCountdownTimer=null;}
    document.getElementById('clearOverlay').classList.remove('show');
    document.getElementById('clearDataModal').classList.remove('show');
  });
  document.getElementById('clearOverlay').addEventListener('click',()=>{
    if(clearCountdownTimer){clearInterval(clearCountdownTimer);clearCountdownTimer=null;}
    document.getElementById('clearOverlay').classList.remove('show');
    document.getElementById('clearDataModal').classList.remove('show');
  });
  // === 云端同步事件 ===
  document.getElementById('swCloudAuto').addEventListener('click',()=>{
    let c={url:'',key:'',autoSync:false};
    try{c=JSON.parse(localStorage.getItem('supabase_config')||'{}');}catch(e){}

    if(window.CloudSync&&window.CloudSync.upload)window.CloudSync.upload();
  });
  document.getElementById('bkCloudDown').addEventListener('click',()=>{
    if(window.CloudSync&&window.CloudSync.download)window.CloudSync.download();
  });
  document.getElementById('bkCloudCfg').addEventListener('click',()=>openCloudCfgDlg());
}

// 打开备份记录列表页（图2）：显示20条记录，点击恢复，支持删除单条
function openBackupRestoreList(){
  document.getElementById('settingsSheet').querySelector('.sheet-title').textContent='恢复历史备份';
  const body=document.getElementById('settingsBody');
  body.innerHTML=`
    <div class="section" style="margin-bottom:12px">
      <div class="info-hint" style="text-align:left;padding:4px 4px;color:var(--danger)">
        ⚠️ 恢复会覆盖当前所有数据！建议恢复前先手动备份一份当前状态。
      </div>
    </div>
    <div class="section" id="bkListSection">
      <div class="section-title">备份记录 <span style="font-weight:400;color:var(--text-lighter);margin-left:4px" id="bkListCount">加载中...</span></div>
      <div id="bkListWrap" style="max-height:60vh;overflow-y:auto;padding:4px 0"><div class="empty-hint">加载中...</div></div>
    </div>
    <div class="btn-group" style="margin-top:16px">
      <button class="btn btn-secondary" id="bkListBack">← 返回备份管理</button>
    </div>
  `;
  document.getElementById('bkListBack').addEventListener('click',()=>openBackupManager());
  // 加载备份列表
  listBackups().then(arr=>{
    const wrap=document.getElementById('bkListWrap');
    const cnt=document.getElementById('bkListCount');
    if(!arr||arr.length===0){
      cnt.textContent='(0条)';
      wrap.innerHTML=`<div class="empty-hint">暂无备份记录<br><span style="font-size:12px;color:var(--text-lighter)">去「备份管理」创建第一条备份吧</span></div>`;
      return;
    }
    cnt.textContent=`(${arr.length}条，最多${MAX_BACKUPS}条)`;
    wrap.innerHTML=arr.map(r=>{
      const s=r.summary||{};
      const tag=r.note==='自动备份'
        ? `<span style="background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500">自动</span>`
        : `<span style="background:#dcfce7;color:#15803d;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500">手动</span>`;
      return `
        <div class="bk-item" data-id="${r.id}" style="background:#f8fafc;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--border);position:relative">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-size:14px;font-weight:600;color:var(--text)">${fmtBackupTime(r.createdAt)}</div>
            <div style="display:flex;align-items:center;gap:6px">
              ${tag}
              <span style="font-size:11px;color:var(--text-lighter)">${(r.sizeKB||0)}KB</span>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;font-size:11px;color:var(--text-light);margin-bottom:8px">
            <div>${s.buildingCount||0}栋</div>
            <div>${s.roomCount||0}间</div>
            <div>${s.tenantCount||0}位租客</div>
            <div>${s.monthCount||0}条费用</div>
            <div>${s.archiveCount||0}条归档</div>
            <div></div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary bk-restore" data-id="${r.id}" style="padding:8px 0;font-size:13px">恢复此备份</button>
            <button class="btn btn-danger bk-del" data-id="${r.id}" style="flex:0 0 60px;padding:8px 0;font-size:13px;background:var(--danger-bg);color:var(--danger)">删除</button>
          </div>
        </div>
      `;
    }).join('');
    // 绑定恢复按钮
    wrap.querySelectorAll('.bk-restore').forEach(btn=>{
      btn.addEventListener('click',(e)=>{
        e.stopPropagation();
        const id=btn.dataset.id;
        const item=arr.find(x=>x.id==id);
        if(!item)return;
        const ok=confirm(`恢复此备份？\n时间：${fmtBackupTime(item.createdAt)}\n\n恢复后当前所有数据将被覆盖，建议先手动备份当前数据！\n\n确定恢复？`);
        if(!ok)return;
        btn.disabled=true;btn.style.opacity='.6';btn.textContent='恢复中...';
        restoreBackup(id).then(ok2=>{
          toast('✅ 恢复成功');
          // 返回备份管理并刷新
          openBackupManager();
        }).catch(err=>{
          btn.disabled=false;btn.style.opacity='1';btn.textContent='恢复此备份';
          toast('恢复失败：'+(err.message||err));
        });
      });
    });
    // 绑定删除按钮（带确认）
    wrap.querySelectorAll('.bk-del').forEach(btn=>{
      btn.addEventListener('click',(e)=>{
        e.stopPropagation();
        const id=btn.dataset.id;
        if(!confirm('确定删除这条备份记录？删除后不可恢复！'))return;
        deleteBackup(id).then(ok=>{
          toast(ok?'已删除':'删除失败');
          if(ok)openBackupRestoreList(); // 刷新列表
        });
      });
    });
  });
}

// 归档记录查看
function showAllArchives(){
  const body=document.getElementById('sheetBody');
  document.getElementById('sheetTitle').textContent='归档记录';
  const allArchives=[];
  for(const key in state.rooms){
    const room=state.rooms[key];
    const[bId,num]=key.split('-');
    const bld=getBuilding(bId);const bName=bld?bld.name:(bId+'栋');
    (room.archived||[]).forEach((a,i)=>{
      allArchives.push({key,archiveIdx:i,bName,num,...a});
    });
  }
  // 按退租日期倒序排列
  allArchives.sort((x,y)=>(y.leaveDate||'').localeCompare(x.leaveDate||''));
  if(allArchives.length===0){
    body.innerHTML=`<div class="empty-hint">暂无归档记录</div><div class="btn-group"><button class="btn btn-primary" id="btnArrearsBack">关闭</button></div>`;
    document.getElementById('btnArrearsBack').addEventListener('click',closeSheet);
  }else{
    body.innerHTML=`
      <div class="section">
        <div class="section-title">全部归档租客 (${allArchives.length})</div>
        ${allArchives.map(a=>`
          <div class="archive-item" data-room="${a.key}" data-idx="${a.archiveIdx}">
            <div class="archive-icon">📁</div>
            <div class="archive-info">
              <div class="archive-name">${esc(a.tenant)||'未命名'} · ${esc(a.bName)} ${esc(a.num)}房</div>
              <div class="archive-date">${a.moveInDate||'?'} ~ ${a.leaveDate||'?'}</div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="btn-group"><button class="btn btn-primary" id="btnArrearsBack">关闭</button></div>
    `;
    body.querySelectorAll('.archive-item').forEach(item=>{
      item.addEventListener('click',()=>{
        const roomKey=item.dataset.room;
        const archIdx=parseInt(item.dataset.idx);
        showArchivedTenant(roomKey,archIdx);
      });
    });
    document.getElementById('btnArrearsBack').addEventListener('click',closeSheet);
  }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

(function initSwipeToClose(){
  const threshold=50;
  document.querySelectorAll('[data-swipe-close]').forEach(el=>{
    let startY=0,startX=0,tracking=false,closeFn=null;
    el.addEventListener('touchstart',e=>{
      startY=e.touches[0].clientY;startX=e.touches[0].clientX;tracking=true;
    },{passive:true});
    el.addEventListener('touchmove',e=>{
      if(!tracking)return;
      const dy=e.touches[0].clientY-startY;
      const dx=e.touches[0].clientX-startX;
      if(dy>threshold&&dy>Math.abs(dx)){
        const fnName=el.getAttribute('data-swipe-close');
        if(typeof window[fnName]==='function')window[fnName]();
        tracking=false;
      }
    },{passive:true});
    el.addEventListener('touchend',()=>{tracking=false;});
    el.addEventListener('mousedown',e=>{startY=e.clientY;startX=e.clientX;tracking=true;});
    document.addEventListener('mousemove',e=>{
      if(!tracking)return;
      const dy=e.clientY-startY,dx=e.clientX-startX;
      if(dy>threshold&&dy>Math.abs(dx)){
        const fnName=el.getAttribute('data-swipe-close');
        if(typeof window[fnName]==='function')window[fnName]();
        tracking=false;
      }
    });
    document.addEventListener('mouseup',()=>{tracking=false;});
  });
})();

/* ============================================================ 数据保护：页面关闭/切后台时强制保存 + 退出时自动备份 ============================================================ */
// APP打开后，退出（关闭/切后台）时是否已经做过自动备份？同一轮只做一次
let _autoBackedThisSession=false;
// 页面切到后台或关闭时，强制保存一次（防止自动保存定时器未执行就退出），并触发自动备份
let _isUnloading=false;
function flushSave(triggerAutoBackup){
  if(_isUnloading)return;
  _isUnloading=true;
  try{
    // 如果当前正在编辑房间，先收集表单数据
    if(currentRoomKey&&state.rooms[currentRoomKey]){
      const r=state.rooms[currentRoomKey];
      const fTenant=document.getElementById('fTenant');
      if(fTenant){
        r.tenant=val('fTenant');r.phone=val('fPhone');r.idCard=val('fIdCard');
        r.moveInDate=val('fDate');r.note=val('fNote');r.fixedRent=val('fFixedRent');
        r.deposit.amount=val('fDeposit');r.deposit.method=val('fDepositMethod');
      }
    }
    save();
    // 退出时触发一次自动备份（仅当开启自动备份 且 本轮还未备份 时）
    if(triggerAutoBackup&&!_autoBackedThisSession){
      const cfg=getBackupCfg();
      if(cfg.autoBackup){
        _autoBackedThisSession=true;
        // 异步发起（不阻塞保存流程，即使失败也不影响）
        try{autoBackupOnExit();}catch(e){console.warn('autoBackupOnExit err',e);}
      }
      // 退出时也触发云端同步（如果有pending）
      if(window._cloudSyncOnExit){try{window._cloudSyncOnExit();}catch(e){console.warn('cloudSyncOnExit err',e);}}
    }
  }catch(e){console.warn('flushSave failed',e);}
  _isUnloading=false;
}
// 页面隐藏时保存（切后台、最小化等）—— 这等同于"退出APP"，触发自动备份
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){flushSave(true);}
});
// 页面关闭前保存 —— 触发自动备份
window.addEventListener('beforeunload',()=>{flushSave(true);});
window.addEventListener('pagehide',()=>{flushSave(true);});

// 定期保存（每30秒自动保存一次，防止意外）—— 只保存，不备份
setInterval(()=>{flushSave(false);},30000);

// 启动后检查备份提醒
setTimeout(()=>{
  const cfg=getBackupCfg();
  // 检查是否有数据
  let hasData=false;
  for(const key in state.rooms){
    const r=state.rooms[key];
    if(r.tenant||r.phone||Object.keys(r.months||{}).length>0||(r.archived||[]).length>0){
      hasData=true;break;
    }
  }
  if(!hasData)return;
  // 优先提醒开启自动备份
  if(!cfg.autoBackup){
    toast('建议开启「退出时自动备份」→ 点击顶部 ☁ 云图标');
  }else{
    // 已开启自动备份，再看看是否超过7天没备份（没触发过退出）
    const lastBackup=getLastBackupTime();
    if(!lastBackup||(Date.now()-lastBackup)>7*86400000){
      toast('建议手动备份一次或导出数据库文件 → 点击顶部 ☁ 云图标');
    }
  }
},2500);

/* ============================================================ Service Worker 离线缓存 ============================================================ */
// 注册 Service Worker，让应用页面本身缓存到手机本地
// 添加到主屏幕后，即使断网或链接失效，应用仍可离线打开使用
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').then(reg=>{
      console.log('✅ Service Worker 已注册，应用支持离线使用');
      // 每次打开页面时检查 SW 更新
      reg.update();
      // 监听新 SW 激活后自动刷新页面
      let refreshing=false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        if(refreshing)return;
        refreshing=true;
        window.location.reload();
      });
    }).catch(err=>{
      console.warn('Service Worker 注册失败（不影响正常使用，仅影响离线缓存）',err);
    });
  });
}
</script>


<!-- Cloud Sync Inline -->
<script>
(function(){
  "use strict";
  var CKEY="supabase_config";
  function loadCfg(){try{var r=localStorage.getItem(CKEY);return r?JSON.parse(r):{url:"",key:"",autoSync:false};}catch(e){return{url:"",key:"",autoSync:false};}}
  function saveCfg(c){localStorage.setItem(CKEY,JSON.stringify(c));}
  var cfg=loadCfg(),sbClient=null,ready=false;
  function initSB(){if(!cfg.url||!cfg.key){ready=false;return false;}if(typeof window.supabase==="undefined"){ready=false;return false;}try{sbClient=window.supabase.createClient(cfg.url,cfg.key);ready=true;return true;}catch(e){ready=false;return false;}}
  function lastSync(){return parseInt(localStorage.getItem(STORAGE_KEY+"_lastCloudSync")||"0");}
  function setSync(){localStorage.setItem(STORAGE_KEY+"_lastCloudSync",Date.now().toString());}
  async function upload(){if(!ready){toast("请先配置云同步");return;}try{var j=JSON.stringify(state);var r=await sbClient.from("rent_data").upsert({id:1,data:j,updated_at:new Date().toISOString()});if(r.error)throw r.error;setSync();toast("已同步到云端");updCloudUI();}catch(e){toast("同步失败: "+(e.message||e));}}
  async function download(){if(!ready){toast("请先配置云同步");return;}try{var r=await sbClient.from("rent_data").select("data,updated_at").eq("id",1).single();if(r.error)throw r.error;if(!r.data||!r.data.data){toast("云端暂无数据");return;}var cs=JSON.parse(r.data.data);if(!cs.rooms){toast("数据格式错误");return;}var t=new Date(r.data.updated_at).toLocaleString("zh-CN");if(!confirm("云端更新于: "+t+"\n\n用云端数据覆盖本地吗?\n(建议先导出备份)"))return;state=cs;_lastJson=JSON.stringify(state);initRooms();save();renderAll();toast("已从云端恢复");}catch(e){toast("下载失败: "+(e.message||e));}}
  var _os=null,_st=null,_cloudSyncPending=false;
  function hookSave(){if(typeof window.save!=="function"||_os)return;_os=window.save;window.save=function(){_os.apply(this,arguments);if(ready&&cfg.autoSync){var cj=JSON.stringify(state);if(cj===_lastJson)return;_lastJson=cj;_cloudSyncPending=true;}};}
  // 退出/切后台时触发云端同步
  window._cloudSyncOnExit=function(){if(ready&&cfg.autoSync&&_cloudSyncPending){_cloudSyncPending=false;upload().catch(function(){});}};
  // 更新备份管理页中的云同步UI
  function updCloudUI(){
    var ls=lastSync();var ts=ls?new Date(ls).toLocaleString("zh-CN"):"从未同步";
    var el=document.getElementById("bkCloudLast");if(el)el.textContent=ts;
  }
  // 云同步配置弹窗（全局可调用）
  function cfgDlg(){
    var ss=document.getElementById("settingsSheet");
    var st=ss.querySelector(".sheet-title");
    var sb=document.getElementById("settingsBody");
    var orig=sb.innerHTML;
    if(st)st.textContent="☁️ 配置 Supabase";
    sb.innerHTML='<div class="section"><div class="section-title">连接配置</div>'+
      '<div class="form-row"><label>Project URL</label><input type="text" id="cfgUrl" placeholder="https://xxxx.supabase.co" value="'+(cfg.url||'')+'"></div>'+
      '<div class="form-row"><label>Anon Public Key</label><textarea id="cfgKey" placeholder="eyJhbGciOiJIUzI1NiIs..." style="min-height:72px;font-size:12px">'+(cfg.key||'')+'</textarea></div>'+
      '<div class="info-hint">获取: supabase.com → 项目 → Settings → API Keys + Data API</div>'+
      '<div class="info-hint" style="color:var(--danger);margin-top:6px">⚠️ 需先执行 supabase-setup.sql</div></div>'+
      '<div class="section"><div class="section-title">说明</div>'+
      '<div class="info-hint" style="line-height:1.8">• 上传: 推送数据到云端<br>• 恢复: 从云端拉取数据<br>• 自动同步: 退出APP或切后台时自动上传</div></div>'+
      '<div class="btn-group"><button class="btn btn-primary" id="btnSaveC">保存</button><button class="btn btn-secondary" id="btnBackC">返回</button><button class="btn btn-danger" id="btnClrC" style="flex:0 0 auto;padding:12px 16px">清除</button></div>';
    function restore(){openBackupManager();}
    document.getElementById("btnSaveC").addEventListener("click",function(){var u=document.getElementById("cfgUrl").value.trim();var k=document.getElementById("cfgKey").value.trim();if(!u||!k){toast("请填写完整");return;}cfg.url=u;cfg.key=k;saveCfg(cfg);initSB();toast("配置已启用");restore();});
    document.getElementById("btnBackC").addEventListener("click",restore);
    document.getElementById("btnClrC").addEventListener("click",function(){if(!confirm("确定清除?"))return;cfg={url:"",key:"",autoSync:false};saveCfg(cfg);ready=false;sbClient=null;toast("已清除");restore();});
  }
  window.openCloudCfgDlg=cfgDlg;
  // 暴露 upload/download 供备份管理页调用
  window.CloudSync={upload:upload,download:download,isReady:function(){return ready;},uploadImage:undefined};
  if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){initSB();_lastJson=JSON.stringify(state);hookSave();});}else{initSB();_lastJson=JSON.stringify(state);hookSave();}
  async function uploadImageToStorage(base64Data){
    if(!ready||!sbClient){throw new Error('云同步未配置');}
    var parts=base64Data.split(',');
    var mime=parts[0].match(/:(.*?);/)[1];
    var bstr=atob(parts[1]),n=bstr.length,u8arr=new Uint8Array(n);
    while(n--){u8arr[n]=bstr.charCodeAt(n);}
    var blob=new Blob([u8arr],{type:mime});
    var filename='rent-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    var r=await sbClient.storage.from('rent-images').upload(filename,blob,{contentType:'image/jpeg'});
    if(r.error) throw r.error;
    var url=sbClient.storage.from('rent-images').getPublicUrl(filename).data.publicUrl;
    return url;
  }
  window.CloudSync={upload:upload,download:download,isReady:function(){return ready;},uploadImage:uploadImageToStorage};
})();
</script>
