<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="房租统计">
<meta name="theme-color" content="#5C6DFF">
<meta name="application-name" content="房租费用统计">
<!-- 内嵌 SVG 图标，添加到主屏幕时显示 -->
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%235C6DFF'/%3E%3Ctext x='90' y='115' font-size='80' text-anchor='middle' fill='white'%3E🏠%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%235C6DFF'/%3E%3Ctext x='90' y='115' font-size='80' text-anchor='middle' fill='white'%3E🏠%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="./manifest.json">
<title>房租费用统计工作台</title>
<style>
  /* ===== 左侧楼栋菜单 ===== */
  :root{
    --primary:#5C6DFF;--primary-dark:#4B5BF0;--primary-light:#818CF8;
    --bg:#F7FBFC;--card:#ffffff;--text:#1e293b;--text-light:#64748b;--text-lighter:#94a3b8;
    --border:#e2e8f0;--success:#22c55e;--success-bg:#dcfce7;--warning:#f59e0b;--warning-bg:#fef9c3;
    --danger:#ef4444;--danger-bg:#fee2e2;--purple:#7e22ce;--purple-bg:#f3e8ff;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --sidebar-w:200px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  input,textarea,select,button{font-family:inherit}

  /* 侧栏收起态：通过 body.sidebar-collapsed 控制 */
  body.sidebar-collapsed{--sidebar-w:0px}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:200px;z-index:110;
    background:#fff;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 0;
    box-shadow:2px 0 8px rgba(0,0,0,.08);
    border-right:1px solid var(--border);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
  }
  body.sidebar-collapsed .sidebar{transform:translateX(-200px)}
  .sidebar-header{
    padding:14px 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;
  }
  .sidebar-header-title{font-size:16px;font-weight:600;color:var(--text)}
  .sidebar-header-btn{
    width:28px;height:28px;border:none;border-radius:7px;background:#f1f5f9;color:var(--text-light);
    font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .sidebar-header-btn:active{background:#e2e8f0}
  .sidebar-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0}
  .sb-building{
    margin:0 8px 8px;border-radius:10px;overflow:hidden;border:1px solid var(--border);
  }
  .sb-building.active{border-color:var(--primary);box-shadow:0 0 0 2px rgba(92,109,255,.1)}
  .sb-building-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;cursor:pointer;background:#f8fafc;
  }
  .sb-building.active .sb-building-header{background:#eff6ff}
  .sb-building-name{font-size:14px;font-weight:600;color:var(--text)}
  .sb-building-summary{font-size:10px;color:var(--text-light);margin-top:2px}
  .sb-building-arrow{font-size:11px;color:var(--text-lighter);transition:transform .25s}
  .sb-building.expanded .sb-building-arrow{transform:rotate(90deg)}
  .sb-building-body{display:none;padding:4px 8px 8px}
  .sb-building.expanded .sb-building-body{display:block}
  .sb-building-head-left{flex:1;min-width:0}
  .sb-building-edit{
    width:32px;height:32px;border:none;border-radius:8px;background:transparent;color:var(--text-light);
    font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    margin-left:4px;transition:background .15s;
  }
  .sb-building-edit:active{background:rgba(0,0,0,.08)}
  .sb-floor-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:7px 8px;border-radius:7px;margin-bottom:3px;background:#fff;
  }
  .sb-floor-row:active{background:#f1f5f9}
  .sb-floor-label{font-size:13px;font-weight:500;color:var(--text);cursor:pointer;flex:1}
  .sb-floor-ctrl{display:flex;align-items:center;gap:4px}
  .sb-floor-btn{
    width:24px;height:24px;border:1px solid var(--border);border-radius:6px;
    background:#fff;color:var(--text-light);font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .sb-floor-btn:active{background:#f1f5f9}
  .sb-floor-edit{
    width:24px;height:24px;border:1px solid var(--border);border-radius:6px;
    background:#fff;color:var(--primary);font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
    margin-left:3px;
  }
  .sb-floor-edit:active{background:#eff6ff}
  .sb-floor-count{font-size:12px;color:var(--text);min-width:28px;text-align:center;font-weight:500}
  .sb-add-floor{
    width:100%;padding:7px 0;border:1px dashed var(--border);border-radius:7px;
    background:transparent;color:var(--text-light);font-size:12px;cursor:pointer;margin-top:4px;
  }
  .sb-add-floor:active{background:#f8fafc}
  .sb-add-building{
    margin:0 8px;padding:10px 0;border:1px dashed var(--primary);border-radius:10px;
    background:transparent;color:var(--primary);font-size:13px;font-weight:500;cursor:pointer;
  }
  .sb-add-building:active{background:#eff6ff}
  .sb-bottom{flex-shrink:0;border-top:1px solid var(--border);padding:8px}
  .sb-archive-btn{
    width:100%;padding:11px 0;border:none;border-radius:9px;
    background:var(--warning-bg);color:var(--warning);font-size:14px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .sb-archive-btn:active{opacity:.7}
  .sb-archive-btn .badge{
    background:var(--warning);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;
  }

  /* ===== 顶部标题栏 ===== */
  .header{
    position:fixed;top:0;left:var(--sidebar-w);right:0;z-index:100;
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
    color:#fff;padding:env(safe-area-inset-top) 0 0;
    box-shadow:0 2px 12px rgba(92,109,255,.25);
    transition:left .3s cubic-bezier(.32,.72,0,1);
  }
  .header-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px}
  .header-title-wrap{flex:1}
  .header-title{font-size:18px;font-weight:600}
  .header-subtitle{font-size:12px;opacity:.85;margin-top:1px}
  .header-actions{display:flex;gap:8px}
  .header-btn{width:36px;height:36px;border:none;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .header-btn:active{background:rgba(255,255,255,.3)}

  .search-bar{display:none;padding:0 16px 12px}
  .search-bar.show{display:block}
  .search-input-wrap{position:relative}
  .search-input{width:100%;padding:10px 12px 10px 38px;border:none;border-radius:10px;font-size:15px;background:rgba(255,255,255,.95);color:var(--text)}
  .search-input::placeholder{color:var(--text-lighter)}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text-light)}
  .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;border-radius:50%;background:#e2e8f0;color:var(--text-light);font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center}
  .search-clear.show{display:flex}

  .search-results{display:none;padding:0 10px}
  .search-results.show{display:block}
  .search-result-item{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:12px}
  .search-result-item:active{background:#f8fafc}
  .sr-room{width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
  .sr-info{flex:1;min-width:0}
  .sr-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
  .sr-tag{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:400}
  .sr-detail{font-size:12px;color:var(--text-light);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===== 主内容区 ===== */
  .main{padding-top:96px;padding-bottom:24px;padding-left:var(--sidebar-w);height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:padding-left .3s cubic-bezier(.32,.72,0,1)}
  .main.searching{padding-top:auto}

  .overview{margin:10px 10px;background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .overview-title{font-size:13px;color:var(--text-light);margin-bottom:10px;font-weight:500;display:flex;align-items:center;gap:6px}
  .overview-title::before{content:'';width:3px;height:14px;background:var(--primary);border-radius:2px}
  .overview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .overview-item{text-align:center;background:#f8fafc;border-radius:10px;padding:10px 6px}
  .overview-item.clickable{cursor:pointer;transition:background .15s}
  .overview-item.clickable:active{background:#f1f5f9}
  .ov-detail{font-size:11px;color:var(--text-light);text-align:left;padding:6px 8px 0;line-height:1.7;border-top:1px solid var(--border);margin-top:6px}
  .ov-detail .ovd-row{display:flex;justify-content:space-between}
  .ov-detail .ovd-label{color:var(--text-lighter)}
  .ov-detail .ovd-val{font-weight:600}
  .overview-num{font-size:18px;font-weight:700}
  .overview-label{font-size:11px;color:var(--text-light);margin-top:2px}

  .floor{background:var(--card);margin:10px 10px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .floor-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer}
  .floor-title{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
  .floor-badge{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .floor-info{font-size:12px;color:var(--text-light);display:flex;align-items:center;gap:8px}
  .floor-arrow{transition:transform .25s;font-size:11px;color:var(--text-lighter)}
  .floor.expanded .floor-arrow{transform:rotate(90deg)}
  .floor-body{display:none;padding:4px 12px 12px}
  .floor.expanded .floor-body{display:block}

  .rooms-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .room-cell{aspect-ratio:.8;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:600;font-size:14px;transition:transform .1s;border:2px solid transparent;position:relative;padding:2px 0}
  .room-cell:active{transform:scale(.9)}
  .room-cell .r-num{font-size:15px;font-weight:600;line-height:1.2}
  .room-cell .r-tenant{font-size:11px;font-weight:500;margin-top:2px;line-height:1.2;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .room-cell .r-arrears{font-size:10px;font-weight:700;color:var(--danger);margin-bottom:1px;line-height:1.2}
  .room-empty{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
  .room-empty .r-tenant{color:#94a3b8}
  .room-occupied{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
  .room-unpaid{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
  .room-maintenance{background:#fefce8;color:#a16207;border-color:#fde68a}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:201;display:none;opacity:0;transition:opacity .15s}
  .overlay.show{display:block;opacity:1}
  .overlay.closing{opacity:0}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:202;background:var(--bg);border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);padding-bottom:env(safe-area-inset-bottom)}
  .sheet.fullscreen-mode{border-radius:0;max-height:none;height:100vh;top:0}
  .sheet.show{transform:translateY(0)}
  .page-fullscreen{position:fixed;inset:0;z-index:201;background:var(--bg);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}
  .page-fullscreen.show{transform:translateY(0)}
  .page-fullscreen .sheet-header{position:sticky;top:0;z-index:5;background:#fff;border-radius:0}
  /* monthSheet 需要在 sheet(全屏房间详情) 之上显示 */
  #monthSheet{z-index:203}
  .sheet-handle{width:36px;height:4px;background:#cbd5e1;border-radius:2px;margin:10px auto 0;touch-action:pan-y}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:5;touch-action:pan-y}
  .swipe-grab{cursor:grab;touch-action:pan-y}
  .modal-swipe-area{height:28px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:pan-y}
  .modal-swipe-bar{width:36px;height:4px;background:#cbd5e1;border-radius:2px}
  .sheet-title{font-size:17px;font-weight:600}
  .sheet-close{width:32px;height:32px;border:none;background:#f1f5f9;border-radius:50%;font-size:20px;color:var(--text-light);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
  .sheet-body{padding:12px 16px 24px}

  .section{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .section-title{font-size:13px;font-weight:600;color:var(--text-light);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .section-title::before{content:'';width:3px;height:13px;background:var(--primary);border-radius:2px}
  .section-title .st-action{margin-left:auto;font-size:12px;color:var(--primary);font-weight:500;cursor:pointer}

  .form-row{margin-bottom:10px}
  .form-row:last-child{margin-bottom:0}
  .form-row label{display:block;font-size:13px;color:var(--text-light);margin-bottom:4px;font-weight:500}
  .form-row input,.form-row textarea,.form-row select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:15px;background:#fff;color:var(--text);transition:border-color .15s}
  .form-row input:focus,.form-row textarea:focus,.form-row select:focus{outline:none;border-color:var(--primary)}
  .form-row textarea{resize:vertical;min-height:56px}
  .form-row-2{display:flex;gap:10px}
  .form-row-2>div{flex:1}
  .form-row-3{display:flex;gap:8px}
  .form-row-3>div{flex:1}

  .input-with-btn{display:flex;gap:8px;align-items:stretch}
  .input-with-btn input{flex:1}
  .input-icon-btn{flex-shrink:0;width:44px;border:1.5px solid var(--border);border-radius:9px;background:#f8fafc;cursor:pointer;font-size:18px;color:var(--primary);display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative;overflow:hidden}
  .input-icon-btn:active{background:#e2e8f0}
  .input-icon-btn.has-img{border-color:var(--primary);background:var(--primary)}
  .input-icon-btn.has-img .iib-icon{display:none}
  .input-icon-btn .iib-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:7px}
  .input-icon-btn .iib-del{position:absolute;top:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;border:1.5px #fff solid;font-size:11px;display:none;align-items:center;justify-content:center;z-index:2;line-height:1}
  .input-icon-btn.has-img .iib-del{display:flex}

  .status-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0}
  .pill{padding:7px 14px;border-radius:18px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text-light);transition:all .15s}
  .pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .fee-calc{background:#f8fafc;border-radius:10px;padding:12px;margin-top:8px}
  .fee-calc-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px}
  .fee-calc-row .fc-label{color:var(--text-light)}
  .fee-calc-row .fc-value{font-weight:600}
  .fee-calc-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:8px;font-size:15px}
  .fee-calc-row.total .fc-value{color:var(--danger);font-size:17px}

  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .month-nav-btn{width:36px;height:36px;border:1.5px solid var(--border);border-radius:9px;background:#fff;cursor:pointer;font-size:14px;color:var(--text-light);display:flex;align-items:center;justify-content:center}
  .month-nav-btn:active{background:#f1f5f9}
  .month-nav-current{font-size:16px;font-weight:600}
  .month-list-item{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
  .month-list-item:active{background:#f8fafc}
  .month-list-item.unpaid{border-left:3px solid var(--danger)}
  .month-list-item.paid{border-left:3px solid var(--success)}
  .swipe-item-wrap{position:relative;overflow:hidden;margin-bottom:8px;border-radius:10px}
  .swipe-item-content{position:relative;z-index:1;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:transform .25s cubic-bezier(.32,.72,0,1);touch-action:pan-y}
  .swipe-item-content.unpaid{border-left:3px solid var(--danger)}
  .swipe-item-content.paid{border-left:3px solid var(--success)}
  .swipe-item-content.swiped{transform:translateX(-150px)}
  .swipe-actions{position:absolute;right:0;top:0;bottom:0;display:flex;z-index:0}
  .swipe-actions button{width:75px;border:none;font-size:13px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:500}
  .swipe-actions .sa-received{background:var(--success)}
  .swipe-actions .sa-edit{background:var(--primary)}
  .swipe-actions .sa-delete{background:var(--danger)}
  .mli-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .mli-month{font-size:15px;font-weight:600}
  .mli-total{font-size:15px;font-weight:700;color:var(--danger)}
  .mli-status{font-size:10px;padding:1px 8px;border-radius:8px;font-weight:500;display:inline-block;margin-top:4px}
  .mli-status.paid{background:var(--success-bg);color:#15803d}
  .mli-status.unpaid{background:var(--danger-bg);color:#b91c1c}
  .mli-detail{font-size:12px;color:var(--text-light);line-height:1.6}

  .archive-item{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
  .archive-item:active{background:#f8fafc}
  .archive-icon{width:36px;height:36px;border-radius:9px;background:var(--text-lighter);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .archive-info{flex:1;min-width:0}
  .archive-name{font-size:14px;font-weight:600}
  .archive-date{font-size:12px;color:var(--text-light);margin-top:1px}

  .btn-group{display:flex;gap:10px;margin-top:12px}
  .btn{flex:1;padding:12px 0;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;transition:opacity .15s}
  .btn:active{opacity:.7}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-danger{background:var(--danger-bg);color:var(--danger)}
  .btn-secondary{background:#f1f5f9;color:var(--text)}
  .btn-warn{background:var(--warning-bg);color:var(--warning)}
  .btn-full{width:100%;padding:11px 0;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;background:var(--primary);color:#fff;margin-top:8px}
  .btn-full:active{opacity:.7}

<script>
/* ============================================================ 数据层 ============================================================ */
const STORAGE_KEY='building_workbench_v4';
const OLD_KEY='building_workbench_v3';
const STATUS_MAP={
  empty:{label:'空置',cls:'room-empty',text:'空'},
  occupied:{label:'已入住',cls:'room-occupied',text:'住'},
  maintenance:{label:'维修中',cls:'room-maintenance',text:'修'},
  unpaid:{label:'未缴费',cls:'room-unpaid',text:'欠'}
};

let state={
  current:'A',
  buildings:[
    {id:'A',name:'A栋',floors:[{rooms:5},{rooms:5},{rooms:5},{rooms:5},{rooms:5}]},
    {id:'B',name:'B栋',floors:[{rooms:5},{rooms:5},{rooms:5},{rooms:5},{rooms:5}]}
  ],
  globalRates:{waterPrice:6,electricPrice:1.2},
  rooms:{},
  expenses:[]
};
let _lastJson=null; // 供 云同步、备份恢复 等 用于检测 state 变化

function defaultRoom(){
  return {
    tenant:'',phone:'',idCard:'',idCardImg:null,moveInDate:'',
    status:'empty',note:'',fixedRent:'',
    roomRates:{waterPrice:'',electricPrice:''},
    deposit:{amount:'',method:'',receiptImg:null},
    months:{},archived:[]
  };
}

function getBuilding(id){
  return state.buildings.find(b=>b.id===id);
}

function initRooms(){
  state.buildings.forEach(b=>{
    (b.floors||[]).forEach((floor,fIdx)=>{
      const f=fIdx+1;
      for(let r=1;r<=floor.rooms;r++){
        const key=`${b.id}-${f*100+r}`;
        if(!state.rooms[key]){state.rooms[key]=defaultRoom();}
        else{
          const def=defaultRoom();
          for(const k in def){if(state.rooms[key][k]===undefined)state.rooms[key][k]=def[k];}
          if(state.rooms[key].idCardFrontImg&&!state.rooms[key].idCardImg)state.rooms[key].idCardImg=state.rooms[key].idCardFrontImg;
          (state.rooms[key].archived||[]).forEach(a=>{if(a.idCardFrontImg&&!a.idCardImg)a.idCardImg=a.idCardFrontImg;});
        }
        // 自动状态修正
        autoRoomStatus(state.rooms[key]);
      }
    });
  });
}

function migrateV3(){
  try{
    const raw=localStorage.getItem(OLD_KEY);
    if(!raw)return;
    const old=JSON.parse(raw);
    state.current=old.current||'A';
    state.globalRates=old.globalRates||{waterPrice:6,electricPrice:1.2};
    state.rooms=old.rooms||{};
    // v3 buildings 格式为 {floors:5,roomsPerFloor:5}，v4 改为 floors 数组
    if(old.buildings&&old.buildings.length){
      state.buildings=old.buildings.map(b=>{
        const floorsCount=b.floors||5;const rpf=b.roomsPerFloor||5;
        const floors=[];for(let i=0;i<floorsCount;i++)floors.push({rooms:rpf});
        return{id:b.id,name:b.name||b.id+'栋',floors};
      });
    }
    initRooms();
    localStorage.removeItem(OLD_KEY);
    save();
  }catch(e){console.warn('migrate failed',e);}
}

function load(){
  let loaded=false;
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d=JSON.parse(raw);
      state.current=d.current||'A';
      // 兼容旧v4格式(floors为数字)→新格式(floors为数组)
      if(d.buildings&&d.buildings.length){
        state.buildings=d.buildings.map(b=>{
          if(Array.isArray(b.floors))return b;
          const fc=b.floors||5,rpf=b.roomsPerFloor||5;
          const floors=[];for(let i=0;i<fc;i++)floors.push({rooms:rpf});
          return{id:b.id,name:b.name||b.id+'栋',floors};
        });
      }
      state.globalRates=d.globalRates||{waterPrice:6,electricPrice:1.2};
      state.rooms=d.rooms||{};
      state.expenses=d.expenses||[];
      loaded=true;
    }else{
      // localStorage 为空，尝试从 IndexedDB 恢复
      console.log('localStorage为空，尝试从IndexedDB恢复...');
      loadFromIndexedDB().then(idbData=>{
        if(idbData){
          try{
            const d=JSON.parse(idbData);
            if(d&&d.rooms){
              state.current=d.current||'A';
              if(d.buildings&&d.buildings.length){
                state.buildings=d.buildings.map(b=>{
                  if(Array.isArray(b.floors))return b;
                  const fc=b.floors||5,rpf=b.roomsPerFloor||5;
                  const floors=[];for(let i=0;i<fc;i++)floors.push({rooms:rpf});
                  return{id:b.id,name:b.name||b.id+'栋',floors};
                });
              }
              state.globalRates=d.globalRates||{waterPrice:6,electricPrice:1.2};
              state.rooms=d.rooms||{};
              state.expenses=d.expenses||[];
              initRooms();save();renderAll();
              console.log('已从IndexedDB恢复数据');
              setTimeout(()=>toast('数据已从本地恢复'),500);
              return;
            }
          }catch(e){console.warn('IndexedDB数据解析失败',e);}
        }
        // IndexedDB也没有，尝试从上一版本快照恢复
        const prev=localStorage.getItem(STORAGE_KEY+'_prev');
        if(prev){
          try{
            const d=JSON.parse(prev);
            if(d&&d.rooms){
              state.current=d.current||'A';
              if(d.buildings&&d.buildings.length){
                state.buildings=d.buildings.map(b=>{
                  if(Array.isArray(b.floors))return b;
                  const fc=b.floors||5,rpf=b.roomsPerFloor||5;
                  const floors=[];for(let i=0;i<fc;i++)floors.push({rooms:rpf});
                  return{id:b.id,name:b.name||b.id+'栋',floors};
                });
              }
              state.globalRates=d.globalRates||{waterPrice:6,electricPrice:1.2};
              state.rooms=d.rooms||{};
              state.expenses=d.expenses||[];
              initRooms();save();renderAll();
              console.log('已从快照恢复数据');
              setTimeout(()=>toast('数据已从快照恢复'),500);
              return;
            }
          }catch(e){console.warn('快照恢复失败',e);}
        }
        // 都没有，尝试迁移v3
        migrateV3();
      }).catch(()=>{migrateV3();});
      initRooms();
      return; // 异步恢复中，先返回
    }
  }catch(e){
    console.warn('load failed',e);
    // localStorage数据损坏，尝试从快照恢复
    try{
      const prev=localStorage.getItem(STORAGE_KEY+'_prev');
      if(prev){
        const d=JSON.parse(prev);
        if(d&&d.rooms){
          state.current=d.current||'A';
          state.globalRates=d.globalRates||{waterPrice:6,electricPrice:1.2};
          state.rooms=d.rooms||{};
          state.expenses=d.expenses||[];
          if(d.buildings&&d.buildings.length){
            state.buildings=d.buildings.map(b=>{
              if(Array.isArray(b.floors))return b;
              const fc=b.floors||5,rpf=b.roomsPerFloor||5;
              const floors=[];for(let i=0;i<fc;i++)floors.push({rooms:rpf});
              return{id:b.id,name:b.name||b.id+'栋',floors};
            });
          }
          loaded=true;
          console.log('数据损坏，已从快照恢复');
          setTimeout(()=>toast('检测到数据异常，已自动恢复'),500);
        }
      }
    }catch(e2){console.warn('snapshot restore also failed',e2);}
  }
  if(!loaded&&!state.rooms.length){migrateV3();}
  initRooms();
}
function save(){
  try{
    const json=JSON.stringify(state);
    // 1. 主存储：localStorage
    localStorage.setItem(STORAGE_KEY,json);
    // 2. 辅助存储：上一版本快照（用于意外损坏时恢复）
    try{localStorage.setItem(STORAGE_KEY+'_prev',localStorage.getItem(STORAGE_KEY+'_curr')||json);}catch(e){}
    try{localStorage.setItem(STORAGE_KEY+'_curr',json);}catch(e){}
    // 3. 异步写入 IndexedDB（防清缓存丢失，容量更大）
    saveToIndexedDB(json);
    // 4. 记录最后保存时间
    localStorage.setItem(STORAGE_KEY+'_lastSave',Date.now().toString());
    // 5. 存储容量监控
    checkStorageUsage();
  }catch(e){
    console.warn('save failed',e);
    toast('存储空间不足，建议导出备份后清理旧数据');
  }
}

/* ===== IndexedDB 双存储（localStorage 的补充，容量更大、不易被清） + 备份记录存储 ===== */
const MAX_BACKUPS=20;
let _idb=null;
function openIDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject('no IndexedDB');return;}
    if(_idb){resolve(_idb);return;}
    const req=indexedDB.open('building_workbench_db',2);
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('kv')){
        db.createObjectStore('kv');
      }
      if(!db.objectStoreNames.contains('backups')){
        const store=db.createObjectStore('backups',{keyPath:'id',autoIncrement:true});
        store.createIndex('createdAt','createdAt',{unique:false});
      }
    };
    req.onsuccess=(e)=>{_idb=e.target.result;resolve(_idb);};
    req.onerror=()=>reject('IndexedDB open failed');
  });
}
function saveToIndexedDB(json){
  openIDB().then(db=>{
    try{
      const tx=db.transaction('kv','readwrite');
      tx.objectStore('kv').put(json,'state');
      tx.objectStore('kv').put(Date.now().toString(),'lastSave');
      tx.oncomplete=()=>{};
      tx.onerror=()=>console.warn('IDB save error');
    }catch(e){console.warn('IDB save exception',e);}
  }).catch(()=>{});
}
function loadFromIndexedDB(){
  return new Promise((resolve)=>{
    openIDB().then(db=>{
      try{
        const tx=db.transaction('kv','readonly');
        const req=tx.objectStore('kv').get('state');
        req.onsuccess=()=>resolve(req.result||null);
        req.onerror=()=>resolve(null);
      }catch(e){resolve(null);}
    }).catch(()=>resolve(null));
  });
}

/* ===== 备份记录 CRUD ===== */
// 创建备份并写入 IndexedDB，超过 MAX_BACKUPS 时删除最旧的
function createBackup(note){
  return new Promise((resolve,reject)=>{
    openIDB().then(async db=>{
      try{
        // 先汇总当前数据统计信息（摘要）
        let buildingCount=state.buildings.length,roomCount=0,tenantCount=0,monthCount=0,archiveCount=0;
        for(const k in state.rooms){
          const r=state.rooms[k];roomCount++;
          if(r.tenant||r.phone)tenantCount++;
          monthCount+=Object.keys(r.months||{}).length;
          archiveCount+=(r.archived||[]).length;
        }
        const dataStr=JSON.stringify(state);
        const record={
          createdAt:Date.now(),
          note:note||'手动备份',
          summary:{buildingCount,roomCount,tenantCount,monthCount,archiveCount},
          sizeKB:Math.round(dataStr.length/1024),
          data:dataStr
        };
        // 写入
        const tx=db.transaction('backups','readwrite');
        const store=tx.objectStore('backups');
        store.add(record);
        tx.oncomplete=async ()=>{
          try{
            // 若超过 MAX_BACKUPS 条，清理最旧的
            const all=await listBackupsInternal(db);
            if(all.length>MAX_BACKUPS){
              const toDel=all.slice(MAX_BACKUPS);
              const tx2=db.transaction('backups','readwrite');
              const s2=tx2.objectStore('backups');
              toDel.forEach(r=>s2.delete(r.id));
            }
          }catch(e){console.warn('trim backups error',e);}
          setLastBackupTime();
          resolve(true);
        };
        tx.onerror=()=>{console.warn('createBackup tx error');reject('写入失败');};
      }catch(e){console.warn('createBackup exception',e);reject(e.message||e);}
    }).catch(err=>reject(err));
  });
}
function listBackupsInternal(db){
  return new Promise((resolve,reject)=>{
    try{
      const tx=db.transaction('backups','readonly');
      const idx=tx.objectStore('backups').index('createdAt');
      const req=idx.openCursor(null,'prev'); // 按时间倒序
      const arr=[];
      req.onsuccess=(e)=>{
        const c=e.target.result;
        if(c){arr.push(c.value);c.continue();}
        else resolve(arr);
      };
      req.onerror=()=>reject('list error');
    }catch(e){reject(e);}
  });
}
function listBackups(){
  return new Promise((resolve)=>{
    openIDB().then(async db=>{
      try{
        const all=await listBackupsInternal(db);
        // 去掉 data 字段，减少传输
        resolve(all.map(r=>({id:r.id,createdAt:r.createdAt,note:r.note,summary:r.summary,sizeKB:r.sizeKB})));
      }catch(e){resolve([]);}
    }).catch(()=>resolve([]));
  });
}
function deleteBackup(id){
  return new Promise((resolve)=>{
    openIDB().then(db=>{
      try{
        const tx=db.transaction('backups','readwrite');
        tx.objectStore('backups').delete(Number(id));
        tx.oncomplete=()=>resolve(true);
        tx.onerror=()=>resolve(false);
      }catch(e){resolve(false);}
    }).catch(()=>resolve(false));
  });
}
function getBackupData(id){
  return new Promise((resolve)=>{
    openIDB().then(db=>{
      try{
        const tx=db.transaction('backups','readonly');
        const req=tx.objectStore('backups').get(Number(id));
        req.onsuccess=()=>{
          const r=req.result;
          if(!r){resolve(null);return;}
          try{resolve(JSON.parse(r.data));}catch(e){resolve(null);}
        };
        req.onerror=()=>resolve(null);
      }catch(e){resolve(null);}
    }).catch(()=>resolve(null));
  });
}
function restoreBackup(id){
  return new Promise(async (resolve,reject)=>{
    const data=await getBackupData(id);
    if(!data||!data.rooms){reject('备份数据损坏');return;}
    try{
      state=data;_lastJson=JSON.stringify(state);
      initRooms();save();renderAll();
      resolve(true);
    }catch(e){reject(e.message||'恢复失败');}
  });
}

function getLastSaveTime(){

function getLastSaveText(){
  const t=getLastSaveTime();
  if(!t)return '从未保存';
  const diff=Date.now()-t;
  if(diff<60000)return '刚刚保存';
  if(diff<3600000)return Math.floor(diff/60000)+'分钟前保存';
  if(diff<86400000)return Math.floor(diff/3600000)+'小时前保存';
  return Math.floor(diff/86400000)+'天前保存';
}

  if(!t)return true; // 从未备份
  const days=(Date.now()-t)/86400000;

}

/* ============================================================ 工具 ============================================================ */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function val(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}
function money(n){return '¥'+(num(n)).toFixed(2);}
function currentYearMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function formatYM(ym){if(!ym)return '';const parts=String(ym).split('-');if(parts.length<2)return ym;const y=parts[0];const m=parseInt(parts[1]);if(isNaN(m))return ym;return y+'年'+m+'月';}
function monthKey(y,m){return y+'-'+String(m).padStart(2,'0');}

function getRoomRates(room){
  const wp=room.roomRates.waterPrice?num(room.roomRates.waterPrice):num(state.globalRates.waterPrice);
  const ep=room.roomRates.electricPrice?num(room.roomRates.electricPrice):num(state.globalRates.electricPrice);
  return{waterPrice:wp,electricPrice:ep};
}

function getRoomDisplayStatus(room){
  if(room.status==='empty'||room.status==='maintenance')return room.status;
  const ym=currentYearMonth();
  const md=room.months[ym];
  if(md&&!md.paid&&calcMonthFee(room,md).total>0)return'unpaid';
  if(room.status==='occupied')return'occupied';
  if(room.status==='unpaid')return'unpaid';
  return room.status;
}

function calcMonthFee(room,monthData){
  if(!monthData)return{waterUsed:0,waterFee:0,elecUsed:0,elecFee:0,rent:0,deduction:0,total:0};
  const rates=getRoomRates(room);
  const wUsed=num(monthData.waterCurr)-num(monthData.waterPrev);
  const eUsed=num(monthData.electricCurr)-num(monthData.electricPrev);
  const waterFee=(wUsed>0?wUsed:0)*rates.waterPrice;
  const elecFee=(eUsed>0?eUsed:0)*rates.electricPrice;
  const rent=num(monthData.rent);
  const deduction=num(monthData.deduction);
  const subtotal=rent+waterFee+elecFee;
  return{waterUsed:wUsed>0?wUsed:0,waterFee,elecUsed:eUsed>0?eUsed:0,elecFee,rent,deduction,total:Math.max(0,subtotal-deduction)};
}

function compressImage(file,cb,maxW,quality){
  maxW=maxW||800;quality=quality||0.7;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      let w=img.width,h=img.height;
      if(w>maxW){h=h*maxW/w;w=maxW;}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',quality));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
async function uploadCompressImage(file,cb,maxW,quality){
  compressImage(file,async function(b64){
    if(window.CloudSync&&window.CloudSync.isReady&&window.CloudSync.isReady()){
      try{var url=await window.CloudSync.uploadImage(b64);cb(url);}
      catch(e){toast('图片上传失败: '+(e.message||e));cb(b64);}
    }else{cb(b64);}
  },maxW,quality);
}

/* ============================================================ Web Share API ============================================================ */
// 通用文件分享：优先 navigator.share({files})，失败再降级下载
// 注意：必须在用户手势的同步上下文里调用，否则移动端会拒绝
// 对于 CSV 等微信不支持的类型，仍会弹出系统分享面板，用户可选择保存到文件、发到其他App等
async function shareFile(blob,filename,mimeType,textTitle){
  const title=textTitle||'水电费明细';
  // 1. 优先尝试 Web Share API 分享文件（弹出系统分享面板，用户可选择微信/保存到文件/其他App）
  if(navigator.share){
    try{
      const file=new File([blob],filename,{type:mimeType});
      await navigator.share({files:[file],title,text:title});
      return true;
    }catch(e){
      // AbortError 表示用户主动取消分享面板，不降级
      if(e&&e.name==='AbortError')return true;
      // 其它错误（如 NotAllowedError、NotSupportedError）继续降级
    }
  }
  // 2. 降级：尝试用 share 不带 files（仅文本），让用户至少能看到分享面板
  if(navigator.share){
    try{
      await navigator.share({title,text:title+'\n（请在分享面板选择"保存到文件"或其它应用）'});
      return true;
    }catch(e){
      if(e&&e.name==='AbortError')return true;
    }
  }
  // 3. 最终降级：直接下载文件
  const link=document.createElement('a');
  link.download=filename;
  link.href=URL.createObjectURL(blob);
  link.click();
  return false;
}

// 分享图片：canvas → blob → shareFile（图片是微信最支持的分享类型）
async function shareImage(canvas,filename,title){
  return new Promise(resolve=>{
    canvas.toBlob(async(blob)=>{
      const shared=await shareFile(blob,filename,'image/png',title);
      resolve(shared);
    },'image/png');
  });
}

// 下载文件（不尝试分享，直接下载）
function downloadFile(blob,filename){
  const link=document.createElement('a');
  link.download=filename;
  link.href=URL.createObjectURL(blob);
  link.click();
}

// 侧栏左边缘右滑打开 + 侧栏区域左滑收起
(function(){
  let sx=0,sy=0,tracking=false,triggered=false;
  const EDGE=25; // 屏幕左边缘 25px 内触发
  document.addEventListener('touchstart',e=>{
    const collapsed=document.body.classList.contains('sidebar-collapsed');
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;tracking=true;triggered=false;
    // 收起态：仅从左边缘向右滑；展开态：从侧栏区域向左滑可收起
    if(collapsed){if(sx>EDGE)tracking=false;}
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!tracking)return;
    const t=e.touches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)){triggered=true;}
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!tracking)return;tracking=false;if(!triggered)return;
    const collapsed=document.body.classList.contains('sidebar-collapsed');
    const t=e.changedTouches[0];const dx=t.clientX-sx;
    if(collapsed&&dx>60){expandSidebar();}
    else if(!collapsed&&dx<-60&&sx<200){collapseSidebar();}
  });
  // 桌面端鼠标拖拽（兼容测试）
  let mTracking=false,mx=0;
  document.addEventListener('mousedown',e=>{
    const collapsed=document.body.classList.contains('sidebar-collapsed');
    mx=e.clientX;sy=e.clientY;mTracking=true;triggered=false;
    if(collapsed){if(mx>EDGE)mTracking=false;}
  });
  document.addEventListener('mousemove',e=>{
    if(!mTracking)return;
    const dx=e.clientX-mx,dy=e.clientY-sy;
    if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))triggered=true;
  });
  document.addEventListener('mouseup',e=>{
    if(!mTracking)return;mTracking=false;if(!triggered)return;
    const collapsed=document.body.classList.contains('sidebar-collapsed');
    const dx=e.clientX-mx;
    if(collapsed&&dx>60){expandSidebar();}
    else if(!collapsed&&dx<-60&&mx<200){collapseSidebar();}
  });
})();

/* ===== 弹层下滑关闭手势 ===== */
function enableSwipeToClose(sheetEl,closeFn){
  if(!sheetEl)return;
  let startY=0,startTop=0,dragging=false;
  const handle=sheetEl.querySelector('.sheet-handle');
  const target=handle||sheetEl;
  target.addEventListener('touchstart',e=>{
    if(!sheetEl.classList.contains('show'))return;
    startY=e.touches[0].clientY;startTop=sheetEl.offsetTop;dragging=true;
  },{passive:true});
  target.addEventListener('touchmove',e=>{
    if(!dragging)return;
    const dy=e.touches[0].clientY-startY;
    if(dy>0){sheetEl.style.transform='translateY('+dy+'px)';sheetEl.style.transition='none';}
  },{passive:true});
  target.addEventListener('touchend',e=>{
    if(!dragging)return;dragging=false;
    const dy=e.changedTouches[0].clientY-startY;
    sheetEl.style.transition='';sheetEl.style.transform='';
    if(dy>80){closeFn();}
  },{passive:true});
}

/* ============================================================ 首页渲染 ============================================================ */
function renderOverview(){
  const b=getBuilding(state.current);
  if(!b)return;
  const bid=b.id;
  let total=0,occ=0,monthIncome=0,yearIncome=0,arrears=0;
  let mRent=0,mWater=0,mElec=0,yRent=0,yWater=0,yElec=0;
  const ym=currentYearMonth();
  const curYear=ym.split('-')[0];
  const arrearsList=[];
  (b.floors||[]).forEach((floor,fIdx)=>{
    const f=fIdx+1;
    for(let r=1;r<=floor.rooms;r++){
      const room=state.rooms[`${bid}-${f*100+r}`];
      if(!room)continue;
      total++;
      if(room.status!=='empty'&&room.status!=='maintenance')occ++;
      // 当前租客的费用
      const md=room.months[ym];
      if(md&&md.paid){const c=calcMonthFee(room,md);monthIncome+=c.total;mRent+=c.rent;mWater+=c.waterFee;mElec+=c.elecFee;}
      for(const mym in room.months){
        if(mym.startsWith(curYear)&&room.months[mym].paid){const c=calcMonthFee(room,room.months[mym]);yearIncome+=c.total;yRent+=c.rent;yWater+=c.waterFee;yElec+=c.elecFee;}
      }
      for(const mym in room.months){
        if(mym.startsWith(curYear)&&!room.months[mym].paid){
          const calc=calcMonthFee(room,room.months[mym]);
          if(calc.total>0){arrears+=calc.total;arrearsList.push({key:`${bid}-${f*100+r}`,num2:f*100+r,ym:mym,tenant:room.tenant,calc});}
        }
      }
      // 归档租客的已缴费用也要统计（租客虽然退租了，但费用是缴了的）
      (room.archived||[]).forEach((a,aIdx)=>{
        const archMd=a.months?a.months[ym]:null;
        if(archMd&&archMd.paid){
          // 用归档时保存的单价计算
          const archRoom={roomRates:a.roomRates||{},months:{}};
          const c=calcMonthFee(archRoom,archMd);
          monthIncome+=c.total;mRent+=c.rent;mWater+=c.waterFee;mElec+=c.elecFee;
        }
        if(a.months){
          for(const mym in a.months){
            if(mym.startsWith(curYear)&&a.months[mym].paid){
              const archRoom={roomRates:a.roomRates||{},months:{}};
              const c=calcMonthFee(archRoom,a.months[mym]);
              yearIncome+=c.total;yRent+=c.rent;yWater+=c.waterFee;yElec+=c.elecFee;
            }
          }
          // 归档租客的未缴费也要统计到欠缴
          for(const mym in a.months){
            if(mym.startsWith(curYear)&&!a.months[mym].paid){
              const archRoom={roomRates:a.roomRates||{},months:{}};
              const calc=calcMonthFee(archRoom,a.months[mym]);
              if(calc.total>0){arrears+=calc.total;arrearsList.push({key:`${bid}-${f*100+r}`,num2:f*100+r,ym:mym,tenant:a.tenant,calc,archiveIdx:aIdx});}
            }
          }
        }
      });
    }
  });
  // 支出统计
  let monthExpense=0,yearExpense=0;
  const curMonth=ym;
  (state.expenses||[]).forEach(ex=>{
    if(ex.bid!==bid)return;
    const exMonth=ex.date?ex.date.slice(0,7):'';
    const exYear=ex.date?ex.date.slice(0,4):'';
    if(exMonth===curMonth)monthExpense+=num(ex.amount);
    if(exYear===curYear)yearExpense+=num(ex.amount);
  });
  document.getElementById('overviewTitle').textContent=b.name+' · 概览';
  document.getElementById('ovTotalRooms').textContent=total;
  document.getElementById('ovOccupied').textContent=occ;
  document.getElementById('ovVacant').textContent=(total-occ);
  document.getElementById('ovMonthIncome').innerHTML='¥'+monthIncome+' <span id="ovMonthArrow" style="font-size:11px">▶</span>';
  document.getElementById('ovYearIncome').innerHTML='¥'+yearIncome+' <span id="ovYearArrow" style="font-size:11px">▶</span>';
  document.getElementById('ovArrears').textContent='¥'+arrears;
  document.getElementById('ovExpense').textContent='¥'+yearExpense;
  document.getElementById('ovMonthDetail').innerHTML=`<div class="ovd-row"><span class="ovd-label">房租</span><span class="ovd-val">¥${mRent.toFixed(2)}</span></div><div class="ovd-row"><span class="ovd-label">水费</span><span class="ovd-val">¥${mWater.toFixed(2)}</span></div><div class="ovd-row"><span class="ovd-label">电费</span><span class="ovd-val">¥${mElec.toFixed(2)}</span></div><div class="ovd-row"><span class="ovd-label" style="color:#e6a700">支出</span><span class="ovd-val" style="color:#e6a700">-¥${monthExpense.toFixed(2)}</span></div><div class="ovd-row total"><span class="ovd-label">净收入</span><span class="ovd-val">¥${(monthIncome-monthExpense).toFixed(2)}</span></div>`;
  document.getElementById('ovYearDetail').innerHTML=`<div class="ovd-row"><span class="ovd-label">房租</span><span class="ovd-val">¥${yRent.toFixed(2)}</span></div><div class="ovd-row"><span class="ovd-label">水费</span><span class="ovd-val">¥${yWater.toFixed(2)}</span></div><div class="ovd-row"><span class="ovd-label">电费</span><span class="ovd-val">¥${yElec.toFixed(2)}</span></div><div class="ovd-row"><span class="ovd-label" style="color:#e6a700">支出</span><span class="ovd-val" style="color:#e6a700">-¥${yearExpense.toFixed(2)}</span></div><div class="ovd-row total"><span class="ovd-label">净收入</span><span class="ovd-val">¥${(yearIncome-yearExpense).toFixed(2)}</span></div>`;
  // 绑定展开/收起
  const mw=document.getElementById('ovMonthWrap');const nw=mw.cloneNode(true);mw.parentNode.replaceChild(nw,mw);
  nw.addEventListener('click',()=>{const d=document.getElementById('ovMonthDetail');const a=document.getElementById('ovMonthArrow');d.style.display=d.style.display==='none'?'block':'none';a.textContent=d.style.display==='none'?'▶':'▼';});
  const yw=document.getElementById('ovYearWrap');const nyw=yw.cloneNode(true);yw.parentNode.replaceChild(nyw,yw);
  nyw.addEventListener('click',()=>{const d=document.getElementById('ovYearDetail');const a=document.getElementById('ovYearArrow');d.style.display=d.style.display==='none'?'block':'none';a.textContent=d.style.display==='none'?'▶':'▼';});
  const wrap=document.getElementById('ovArrearsWrap');
  const newWrap=wrap.cloneNode(true);
  wrap.parentNode.replaceChild(newWrap,wrap);
  if(arrearsList.length>0){
    newWrap.addEventListener('click',()=>showArrearsDetail(arrearsList,b.name));
  }
  // 支出卡片点击
  const ew=document.getElementById('ovExpenseWrap');
  const newEw=ew.cloneNode(true);
  ew.parentNode.replaceChild(newEw,ew);
  newEw.addEventListener('click',()=>openExpenses(bid));
}

function saveExp(type,editId){
  const date=val('expDate');
  const location=val('expLocation');
  const person=val('expPerson');
  const amount=val('expAmount');
  const note=val('expNote');
  if(!date){toast('请选择日期');return;}
  if(!amount||num(amount)<=0){toast('请输入金额');return;}
  if(!state.expenses)state.expenses=[];
  if(editId){
    const idx=state.expenses.findIndex(e=>e.id===editId);
    if(idx>=0){state.expenses[idx]={...state.expenses[idx],type,date,location:location||'',person:person||'',amount:num(amount),note:note||''};}
    toast('已更新');
  }else{
    state.expenses.push({id:'exp'+Date.now()+Math.random().toString(36).slice(2,6),bid:_expBuildingId,type,date,location:location||'',person:person||'',amount:num(amount),note:note||''});
    toast('支出已保存');
  }
  save();renderExpList(_expBuildingId);
  document.getElementById('expFormSection').style.display='none';
  document.getElementById('expFormSection').innerHTML='';
  renderAll();
}
function deleteExp(id){
  state.expenses=(state.expenses||[]).filter(e=>e.id!==id);
  save();renderExpList(_expBuildingId);renderAll();
  toast('已删除');
}
function editExp(id){
  const ex=(state.expenses||[]).find(e=>e.id===id);if(!ex)return;
  showExpForm(ex.type,ex);
}
let _expDetailId=null;

  const sec=document.getElementById('expFormSection');
  if(_expDetailId===id){
    sec.style.display='none';sec.innerHTML='';_expDetailId=null;return;

  _expDetailId=id;
  showExpDetail(id);

    <div class="fee-calc">

      <div class="fee-calc-row"><span class="fc-label">${fl[1]}</span><span class="fc-value">${esc(ex.location)||'-'}</span></div>

    <div class="form-row"><label>备注</label><textarea id="expNote" placeholder="可选" style="min-height:48px">${editEx?esc(editEx.note):''}</textarea></div>`;

    fields=`<div class="form-row"><label>清洁日期</label><input type="date" id="expDate" value="${today}"></div>
    <div class="form-row"><label>清洁位置</label><input type="text" id="expLocation" placeholder="如：5楼公共区域" value="${editEx?esc(editEx.location):''}"></div>

    <div class="form-row"><label>清洁费用 (¥)</label><input type="number" id="expAmount" placeholder="0" min="0" step="0.01" value="${editEx?editEx.amount:''}"></div>
    <div class="form-row"><label>备注</label><textarea id="expNote" placeholder="可选" style="min-height:48px">${editEx?esc(editEx.note):''}</textarea></div>`;

    fields=`<div class="form-row"><label>购买日期</label><input type="date" id="expDate" value="${today}"></div>
    <div class="form-row"><label>耗材名称</label><input type="text" id="expLocation" placeholder="如：灯泡x10" value="${editEx?esc(editEx.location):''}"></div>
    <div class="form-row"><label>购买渠道</label><input type="text" id="expPerson" placeholder="如：淘宝/五金店" value="${editEx?esc(editEx.person):''}"></div>
    <div class="form-row"><label>购买金额 (¥)</label><input type="number" id="expAmount" placeholder="0" min="0" step="0.01" value="${editEx?editEx.amount:''}"></div>

function renderExpList(bid){
  const sec=document.getElementById('expListSection');if(!sec)return;
  const list=(state.expenses||[]).filter(e=>e.bid===bid).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const types=[{key:'repair',label:'🔧 维修',color:'#3b82f6'},{key:'clean',label:'🧹 清洁',color:'var(--success)'},{key:'supply',label:'📦 耗材',color:'#e6a700'}];
  let html='';
  types.forEach(t=>{
    const items=list.filter(e=>e.type===t.key);
    const subTotal=items.reduce((s,e)=>s+num(e.amount),0);
    html+=`<div class="exp-group" style="margin-bottom:10px">
      <div class="exp-group-header" data-type="${t.key}" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f8fafc;border-radius:8px;cursor:pointer">
        <span style="font-weight:600;color:${t.color}">${t.label}（${items.length}）</span>
        <span style="color:${t.color};font-weight:600">¥${subTotal.toFixed(2)} <span class="exp-arrow" style="font-size:11px">▶</span></span>
      </div>
      <div class="exp-items" style="display:none;padding:4px 0">`;
    if(items.length===0){
      html+=`<div style="text-align:center;color:var(--text-lighter);padding:12px;font-size:13px">暂无记录</div>`;
    }else{
      items.forEach(e=>{
        const personLabel=e.type==='supply'?'购买渠道':(e.type==='repair'?'维修人':'清洁人');
        html+=`<div class="exp-swipe-wrap" style="position:relative;overflow:hidden;margin:4px 0;border-radius:8px">
          <div class="exp-swipe-actions" style="position:absolute;right:0;top:0;bottom:0;display:flex;align-items:stretch">
            <button class="exp-action-edit" data-id="${e.id}" style="width:56px;border:none;background:var(--primary);color:#fff;font-size:12px;cursor:pointer">编辑</button>
            <button class="exp-action-del" data-id="${e.id}" style="width:56px;border:none;background:var(--danger);color:#fff;font-size:12px;cursor:pointer">删除</button>
          </div>
          <div class="exp-swipe-card" data-id="${e.id}" style="position:relative;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;transition:transform .2s;z-index:1;cursor:pointer">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-weight:500">${esc(e.location)||'未填写'}</span>
              <span style="color:${t.color};font-weight:600">¥${num(e.amount).toFixed(2)}</span>
            </div>
            <div style="font-size:12px;color:var(--text-light);margin-top:4px">📅 ${e.date||'未填'} · ${personLabel}：${esc(e.person)||'-'}</div>
          </div>
        </div>`;
      });
    }
    html+=`</div></div>`;
  });
  if(list.length===0){html='<div class="empty-hint" style="padding:20px;text-align:center">暂无支出记录，点击上方按钮添加</div>';}
  sec.innerHTML=`<div class="section-title">📋 支出记录</div>`+html;
  // 绑定折叠
  sec.querySelectorAll('.exp-group-header').forEach(h=>{
    h.addEventListener('click',()=>{
      const items=h.nextElementSibling;
      const arrow=h.querySelector('.exp-arrow');
      items.style.display=items.style.display==='none'?'block':'none';
      arrow.textContent=items.style.display==='none'?'▶':'▼';
    });
  });
  // 绑定点击查看详情
  sec.querySelectorAll('.exp-swipe-card').forEach(card=>{
    let startX=0,startY=0,swiping=false,moved=false;
    card.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;swiping=true;moved=false;},{passive:true});
    card.addEventListener('touchmove',e=>{
      if(!swiping)return;
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){moved=true;e.preventDefault();}
      if(Math.abs(dx)>Math.abs(dy)){card.style.transform='translateX('+Math.max(-112,Math.min(0,dx))+'px)';}
    },{passive:false});
    card.addEventListener('touchend',e=>{
      if(!swiping)return;swiping=false;
      const dx=e.changedTouches[0].clientX-startX;
      if(dx<-50){card.style.transform='translateX(-112px)';}
      else{card.style.transform='translateX(0)';}
      if(!moved){toggleExpDetail(card.dataset.id);}
    });
    // PC端点击
    card.addEventListener('click',e=>{
      if(!moved&&'ontouchstart' in window===false){toggleExpDetail(card.dataset.id);}
    });
  });
  // 绑定编辑/删除按钮
  sec.querySelectorAll('.exp-action-edit').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();editExp(btn.dataset.id);});
  });
  sec.querySelectorAll('.exp-action-del').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();if(confirm('确定删除？'))deleteExp(btn.dataset.id);});
  });
}

function showArrearsDetail(list,bname){
  const body=document.getElementById('sheetBody');
  document.getElementById('sheetTitle').textContent=bname+' · 欠缴明细';
  body.innerHTML=`
    <div class="section">
      <div class="section-title">欠缴租金明细 <span style="font-size:11px;color:var(--text-lighter);font-weight:400;margin-left:6px">左滑显示操作</span></div>
      ${list.map((item,i)=>`
        <div class="swipe-item-wrap">
          <div class="swipe-actions">
            <button class="sa-received" data-idx="${i}">已收回</button>
            <button class="sa-delete" data-idx="${i}">删除</button>
          </div>
          <div class="swipe-item-content unpaid" data-idx="${i}" data-room="${item.key}">
            <div class="mli-header"><span class="mli-month">${item.num2}房 · ${item.tenant||'未命名'}${item.archiveIdx!==undefined?'<span class="sr-tag" style="background:#cbd5e1;color:#fff;margin-left:6px">已归档</span>':''}</span><span class="mli-status unpaid">${formatYM(item.ym)}</span></div>
            <div class="mli-detail">租金${money(item.calc.rent)} · 水费${money(item.calc.waterFee)} · 电费${money(item.calc.elecFee)}</div>
            <div class="mli-total">合计：${money(item.calc.total)}</div>
          </div>
        </div>
      `).join('')}
      <div class="fee-calc" style="margin-top:8px"><div class="fee-calc-row total"><span class="fc-label">欠缴总计</span><span class="fc-value">${money(list.reduce((s,i)=>s+i.calc.total,0))}</span></div></div>
    </div>
    <div class="btn-group"><button class="btn btn-primary" id="btnArrearsBack">关闭</button></div>
  `;
  // 绑定左滑
  body.querySelectorAll('.swipe-item-content').forEach(el=>{
    let startX=0,startY=0,tracking=false,swiped=false;
    el.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;tracking=true;},{passive:true});
    el.addEventListener('touchmove',e=>{
      if(!tracking)return;
      const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
      if(Math.abs(dx)>Math.abs(dy)){
        const offset=swiped?dx-150:dx;
        if(offset<0&&offset>-150){el.style.transform=`translateX(${offset}px)`;el.style.transition='none';}
      }
    },{passive:true});
    el.addEventListener('touchend',e=>{
      if(!tracking)return;tracking=false;
      const dx=e.changedTouches[0].clientX-startX;
      el.style.transition='';
      if(!swiped&&dx<-50){el.classList.add('swiped');swiped=true;}
      else if(swiped&&dx>-50){el.classList.remove('swiped');swiped=false;el.style.transform='';}
      else{el.style.transform='';}
    });
    el.addEventListener('click',()=>{
      if(swiped){el.classList.remove('swiped');swiped=false;el.style.transform='';return;}
      openRoom(el.dataset.room);
    });
  });
  // 已收回/删除
  body.querySelectorAll('.sa-received').forEach(btn=>btn.addEventListener('click',()=>{
    const item=list[parseInt(btn.dataset.idx)];
    const room=state.rooms[item.key];if(!room){toast('房间不存在');return;}
    if(item.archiveIdx!==undefined){
      const a=room.archived[item.archiveIdx];if(a&&a.months&&a.months[item.ym]){a.months[item.ym].paid=true;}
    }else{
      if(room.months[item.ym])room.months[item.ym].paid=true;
    }
    save();renderAll();
    const newList=list.filter((_,i)=>i!==parseInt(btn.dataset.idx));
    if(newList.length===0){closeSheet();toast('已标记为已收回');}
    else{showArrearsDetail(newList,bname);toast('已标记为已收回');}
  }));
  body.querySelectorAll('.sa-delete').forEach(btn=>btn.addEventListener('click',()=>{

function renderFloors(){

  for(let fIdx=floorsCount-1;fIdx>=0;fIdx--){

      rooms.push({num:num2,room});

      if(room.status!=='empty'&&room.status!=='maintenance')occCount++;

        <div class="floor-info">${occCount}/${totalCount} 入住 <span class="floor-arrow">▶</span></div>
      </div>
      <div class="floor-body">
        <div class="rooms-grid">
          ${rooms.map(({num:num2,room})=>{
            const dispStatus=getRoomDisplayStatus(room);
            const s=STATUS_MAP[dispStatus]||STATUS_MAP.empty;
            // 计算该房间所有未缴费月份的合计欠费
            let arrearsTotal=0;
            for(const mym in room.months){

              }
            }

            const tenantName=room.tenant||'';

            const shortName=displayName.length>3?displayName.slice(0,3):displayName;
            return `<div class="room-cell ${s.cls}" data-room="${b.id}-${num2}">
              <span class="r-num">${num2}</span>
              ${arrearsTotal>0?`<span class="r-arrears">¥${arrearsTotal.toFixed(0)}</span>`:''}
              <span class="r-tenant">${esc(shortName)}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    `;

    floorEl.querySelectorAll('.room-cell').forEach(cell=>cell.addEventListener('click',()=>openRoom(cell.dataset.room)));

/* ============================================================ 搜索 ============================================================ */
function doSearch(keyword){
  const results=[];const kw=keyword.toLowerCase().trim();
  if(!kw)return results;
  for(const key in state.rooms){
    const room=state.rooms[key];
    if(room.tenant||room.phone||room.idCard){
      if(room.tenant.toLowerCase().includes(kw)||(room.phone||'').includes(kw)||(room.idCard||'').toLowerCase().includes(kw)){
        results.push({type:'room',key,tenant:room.tenant,phone:room.phone,idCard:room.idCard,status:room.status,archived:false});
      }
    }
    (room.archived||[]).forEach((a,i)=>{
      if((a.tenant||'').toLowerCase().includes(kw)||(a.phone||'').includes(kw)||(a.idCard||'').toLowerCase().includes(kw)){
        results.push({type:'room',key,tenant:a.tenant,phone:a.phone,idCard:a.idCard,status:'archived',archived:true,archiveIdx:i});
      }
    });
  }
  // 搜索支出记录
  (state.expenses||[]).forEach(ex=>{
    const b=getBuilding(ex.bid);const bName=b?b.name:ex.bid;
    const loc=(ex.location||'').toLowerCase();
    const per=(ex.person||'').toLowerCase();
    if(loc.includes(kw)||per.includes(kw)){
      const typeLabels={repair:'维修',clean:'清洁',supply:'耗材'};
      const typeColors={repair:'#3b82f6',clean:'var(--success)',supply:'#e6a700'};
      results.push({type:'expense',expId:ex.id,bid:ex.bid,bName,expType:ex.type,expTypeLabel:typeLabels[ex.type]||ex.type,expColor:typeColors[ex.type]||'var(--primary)',expDate:ex.date,expLocation:ex.location||'-',expPerson:ex.person||'-',expAmount:ex.amount});
    }
  });
  return results;
}
function renderSearchResults(keyword){
  const container=document.getElementById('searchResults');
  const floorList=document.getElementById('floorList');
  const overview=document.querySelector('.overview');
  if(!keyword.trim()){
    container.classList.remove('show');container.innerHTML='';
    floorList.style.display='';overview.style.display='';
    document.getElementById('main').classList.remove('searching');
    return;
  }
  document.getElementById('main').classList.add('searching');
  floorList.style.display='none';overview.style.display='none';
  container.classList.add('show');
  const results=doSearch(keyword);
  if(results.length===0){container.innerHTML='<div class="empty-hint">未找到匹配的结果</div>';return;}
  const roomResults=results.filter(r=>r.type==='room');
  const expResults=results.filter(r=>r.type==='expense');
  let html='';
  if(roomResults.length>0){
    html+=`<div style="font-size:12px;color:var(--text-light);padding:4px 16px">租客结果 (${roomResults.length})</div>`;
    html+=roomResults.map(r=>{
      const s=r.archived?{label:'已归档'}:(STATUS_MAP[r.status]||{label:''});
      return `<div class="search-result-item" data-room="${r.key}" ${r.archived?`data-archive="${r.archiveIdx}"`:''}>
        <div class="sr-room">${r.key.replace('-','')}</div>
        <div class="sr-info">
          <div class="sr-name">${esc(r.tenant)||'未命名'}<span class="sr-tag" style="background:${r.archived?'#cbd5e1':'var(--primary)'};color:#fff">${s.label}</span></div>
          <div class="sr-detail">${r.phone||'无电话'} · ${r.idCard||'无身份证'}</div>
        </div>
      </div>`;
    }).join('');
  }
  if(expResults.length>0){
    html+=`<div style="font-size:12px;color:var(--text-light);padding:8px 16px 4px">支出记录 (${expResults.length})</div>`;
    html+=expResults.map(r=>{
      const personLabel=r.expType==='supply'?'购买渠道':(r.expType==='repair'?'维修人':'清洁人');
      return `<div class="search-result-item" data-expense="${r.expId}" style="border-left:3px solid ${r.expColor}">
        <div class="sr-info" style="width:100%">
          <div class="sr-name">${esc(r.expLocation)}<span class="sr-tag" style="background:${r.expColor};color:#fff">${r.expTypeLabel}</span></div>
          <div class="sr-detail">${r.bName} · ${r.expDate||'未填'} · ${personLabel}：${esc(r.expPerson)} · ¥${num(r.expAmount).toFixed(2)}</div>
        </div>
      </div>`;
    }).join('');
  }
  container.innerHTML=html;
  container.querySelectorAll('.search-result-item[data-room]').forEach(item=>{
    item.addEventListener('click',()=>{
      const roomKey=item.dataset.room;const archiveIdx=item.dataset.archive;
      closeSearch();openRoom(roomKey,archiveIdx!==undefined?parseInt(archiveIdx):null);
    });
  });
  container.querySelectorAll('.search-result-item[data-expense]').forEach(item=>{
    item.addEventListener('click',()=>{
      const exId=item.dataset.expense;
      const exp=(state.expenses||[]).find(e=>e.id===exId);
      if(!exp)return;
      closeSearch();
      const b=getBuilding(exp.bid);
      if(b){
        state.current=exp.bid;
        renderSidebar();renderOverview();
      }
      openExpenses(exp.bid);
      setTimeout(()=>showExpDetail(exId),300);
    });
  });
}

/* ============================================================ OCR ============================================================ */
function recognizeIdCard(imgBase64,callback){
  if(typeof Tesseract==='undefined'){
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    script.onload=()=>doOCR(imgBase64,callback);
    script.onerror=()=>callback(null);
    document.head.appendChild(script);
  }else{doOCR(imgBase64,callback);}
}
function doOCR(imgBase64,callback){
  try{
    Tesseract.recognize(imgBase64,'chi_sim+eng',{logger:()=>{}}).then(({data:{text}})=>{
      const match=text.match(/\d{17}[\dXx]/);
      callback(match?match[0].toUpperCase():null);
    }).catch(()=>callback(null));
  }catch(e){callback(null);}
}

      </div>`;
    }).join('')}</div>`;

  container.querySelectorAll('.swipe-item-content').forEach(el=>{
    let startX=0,startY=0,tracking=false,swiped=false,moved=false;
    el.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;tracking=true;moved=false;},{passive:true});
    el.addEventListener('touchmove',e=>{
      if(!tracking)return;
      const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
      if(Math.abs(dx)>10||Math.abs(dy)>10)moved=true;
      if(Math.abs(dx)>Math.abs(dy)){
        const offset=swiped?dx-150:dx;
        if(offset<0&&offset>-150){el.style.transform=`translateX(${offset}px)`;el.style.transition='none';}
      }
    },{passive:true});
    el.addEventListener('touchend',e=>{
      if(!tracking)return;tracking=false;
      const dx=e.changedTouches[0].clientX-startX;
      el.style.transition='';
      if(!swiped&&dx<-50){el.classList.add('swiped');swiped=true;}
      else if(swiped&&dx>-50){el.classList.remove('swiped');swiped=false;el.style.transform='';}
      else{el.style.transform='';}
    });
    el.addEventListener('click',ev=>{
      if(swiped){el.classList.remove('swiped');swiped=false;el.style.transform='';return;}
      openMonthEdit(key,el.dataset.month);
    });
  });
  container.querySelectorAll('.sa-edit').forEach(btn=>btn.addEventListener('click',()=>openMonthEdit(key,btn.dataset.month)));
  container.querySelectorAll('.sa-delete').forEach(btn=>btn.addEventListener('click',()=>{
    if(!confirm('确定删除 '+formatYM(btn.dataset.month)+' 的记录？'))return;
    delete state.rooms[key].months[btn.dataset.month];
    save();renderMonthList(key);renderAll();toast('已删除');
  }));
  const toggleBtn=document.getElementById('btnToggleMonths');
  if(toggleBtn){
    toggleBtn.addEventListener('click',()=>{
      const hiddenEl=document.getElementById('hiddenMonths');
      const isHidden=hiddenEl.style.display==='none';
      hiddenEl.style.display=isHidden?'block':'none';
      toggleBtn.textContent=isHidden?'收起 ▲':`展开全部 (${hidden.length} 条) ▼`;
    });
  }
}

function switchMonth(key,newYm){
  const room=state.rooms[key];const oldYm=val('monthYm');
  if(newYm===oldYm)return;
  // 保存当前表单内容到临时对象
  const currentData={
    rent:val('mRent'),waterPrev:val('mWaterPrev'),waterCurr:val('mWaterCurr'),
    electricPrev:val('mElecPrev'),electricCurr:val('mElecCurr'),deduction:val('mDeduction'),
    paid:document.getElementById('paidSwitch').classList.contains('on'),note:val('mNote')
  };
  // 如果目标月份已有记录，询问是否覆盖
  if(room.months[newYm]){
    if(!confirm('目标月份 '+formatYM(newYm)+' 已有记录。\n\n点击"确定"：当前编辑内容替换目标月份记录\n点击"取消"：放弃切换'))return;
    delete room.months[oldYm];
    room.months[newYm]=currentData;
  }else{
    // 移动记录：删除旧月份，写入新月份
    delete room.months[oldYm];
    room.months[newYm]=currentData;
  }
  save();
  editingMonth=newYm;
  openMonthEdit(key,newYm);
  toast('已移动到 '+formatYM(newYm));
}

function updateMonthCalc(){
  if(!editingRoomKey)return;
  const room=state.rooms[editingRoomKey];
  const rates=getRoomRates(room);
  const wUsed=num(val('mWaterCurr'))-num(val('mWaterPrev'));
  const eUsed=num(val('mElecCurr'))-num(val('mElecPrev'));
  const wFee=(wUsed>0?wUsed:0)*rates.waterPrice;
  const eFee=(eUsed>0?eUsed:0)*rates.electricPrice;
  const rent=num(val('mRent'));
  const deduction=num(val('mDeduction'));
  const subtotal=rent+wFee+eFee;
  const total=Math.max(0,subtotal-deduction);
  const wuEl=document.getElementById('waterUsed'),wfEl=document.getElementById('waterFee'),euEl=document.getElementById('elecUsed'),efEl=document.getElementById('elecFee'),tEl=document.getElementById('totalFee'),stEl=document.getElementById('subtotalFee'),dEl=document.getElementById('deductionFee');
  if(wuEl)wuEl.textContent=(wUsed>0?wUsed:0).toFixed(1)+' 方';
  if(wfEl)wfEl.textContent=money(wFee);
  if(euEl)euEl.textContent=(eUsed>0?eUsed:0).toFixed(1)+' 度';
  if(efEl)efEl.textContent=money(eFee);
  if(stEl)stEl.textContent=money(subtotal);
  if(dEl)dEl.textContent='-¥'+deduction.toFixed(2);
  if(tEl)tEl.textContent=money(total);
}

function saveMonth(key){
  const ym=val('monthYm');
  const room=state.rooms[key];
  // 水电表读数校验：本月读数必须大于等于上月读数
  const wPrev=num(val('mWaterPrev')),wCurr=num(val('mWaterCurr'));
  const ePrev=num(val('mElecPrev')),eCurr=num(val('mElecCurr'));
  if(wCurr<wPrev){
    toast('⚠️ 本月水表读数('+wCurr+')小于上月('+wPrev+')，请检查');return;
  }
  if(eCurr<ePrev){
    toast('⚠️ 本月电表读数('+eCurr+')小于上月('+ePrev+')，请检查');return;
  }
  room.months[ym]={rent:val('mRent'),waterPrev:val('mWaterPrev'),waterCurr:val('mWaterCurr'),electricPrev:val('mElecPrev'),electricCurr:val('mElecCurr'),deduction:val('mDeduction'),paid:document.getElementById('paidSwitch').classList.contains('on'),note:val('mNote')};
  autoRoomStatus(room);
  save();renderMonthList(key);renderAll();closeMonthSheet();toast('保存成功');
}
function deleteMonth(key){if(!confirm('确定删除该月记录？'))return;const ym=val('monthYm');delete state.rooms[key].months[ym];save();renderMonthList(key);renderAll();closeMonthSheet();toast('已删除');}

  ms.classList.remove('show');

}

let buildingEditId=null,buildingEditMode=null;
let beFloorRooms=[]; // 编辑时各层房间数的临时数组

function renderBeFloorList(){
  const list=document.getElementById('beFloorList');
  if(!list)return;
  list.innerHTML=beFloorRooms.map((cnt,i)=>`
    <div class="form-row" style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px;background:var(--bg);border-radius:10px">
      <span style="font-size:13px;color:var(--text-light);min-width:48px;font-weight:500">${i+1}层</span>
      <div style="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:12px">
        <button class="be-stepper be-step-minus" data-fidx="${i}" data-dir="-1" style="width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:18px;font-weight:600;color:var(--text);line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none">−</button>
        <span class="be-step-count" data-fidx="${i}" style="min-width:48px;text-align:center;font-size:16px;font-weight:600;color:var(--primary)">${cnt} <span style="font-size:11px;color:var(--text-lighter);font-weight:400">间</span></span>
        <button class="be-stepper be-step-plus" data-fidx="${i}" data-dir="1" style="width:34px;height:34px;border-radius:50%;border:1.5px solid var(--primary);background:var(--primary);font-size:18px;font-weight:600;color:#fff;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none">+</button>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.be-stepper').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=parseInt(btn.dataset.fidx);
      const dir=parseInt(btn.dataset.dir);
      let v=beFloorRooms[idx]+dir;
      if(v<1)v=1;if(v>50)v=50;
      beFloorRooms[idx]=v;
      const countEl=list.querySelector(`.be-step-count[data-fidx="${idx}"]`);
      if(countEl)countEl.innerHTML=v+' <span style="font-size:11px;color:var(--text-lighter);font-weight:400">间</span>';
    });
  });
}

function syncBeFloorCount(){
  const fc=parseInt(document.getElementById('beFloorCount').value)||1;
  const cur=beFloorRooms.length;
  if(fc>cur){
    for(let i=cur;i<fc;i++)beFloorRooms.push(5);
  }else if(fc<cur){
    beFloorRooms=beFloorRooms.slice(0,fc);
  }
  renderBeFloorList();
}

  const fc=parseInt(document.getElementById('beFloorCount').value);
  if(!name){toast('请输入楼栋名称');return;}
  if(!fc||fc<1){toast('楼层数至少为1');return;}
  if(fc>30){toast('楼层数不能超过30');return;}
  // 同步最新楼层列表（防止用户改了楼层数没触发change）
  if(beFloorRooms.length!==fc)syncBeFloorCount();
  // 校验每层房间数
  for(let i=0;i<beFloorRooms.length;i++){
    const rc=beFloorRooms[i];
    if(!rc||rc<1){toast(`第${i+1}层房间数至少为1`);return;}
    if(rc>50){toast(`第${i+1}层房间数不能超过50`);return;}
  }

  if(buildingEditMode==='add'){
    const usedIds=state.buildings.map(b=>b.id);
    let newId='A';
    for(let i=65;i<=90;i++){const c=String.fromCharCode(i);if(!usedIds.includes(c)){newId=c;break;}}
    const floors=beFloorRooms.map(r=>({rooms:r}));
    state.buildings.push({id:newId,name:name,floors});
    state.current=newId;
    save();initRooms();renderSidebar();renderAll();
    closeBuildingEdit();toast('已添加 '+name);
  }else{
    const b=getBuilding(buildingEditId);if(!b){closeBuildingEdit();return;}
    const oldFloors=(b.floors||[]).map(f=>f.rooms);
    b.name=name;
    // 处理楼层增减
    const newLen=beFloorRooms.length;
    if(newLen>oldFloors.length){
      // 增加楼层
      for(let i=oldFloors.length;i<newLen;i++)b.floors.push({rooms:beFloorRooms[i]});
    }else if(newLen<oldFloors.length){
      // 减少楼层：检查数据
      let hasData=false;
      for(let fIdx=newLen;fIdx<oldFloors.length;fIdx++){
        const f=fIdx+1;
        for(let r=1;r<=b.floors[fIdx].rooms;r++){
          const key=`${b.id}-${f*100+r}`;
          if(state.rooms[key]&&state.rooms[key].status!=='empty'){hasData=true;break;}
        }
        if(hasData)break;
      }
      if(hasData){
        if(!confirm('减少楼层数将删除被移除楼层的房间数据，确定继续？'))return;
      }
      for(let fIdx=newLen;fIdx<oldFloors.length;fIdx++){
        const f=fIdx+1;
        for(let r=1;r<=b.floors[fIdx].rooms;r++){
          const key=`${b.id}-${f*100+r}`;
          delete state.rooms[key];
        }
      }
      b.floors=b.floors.slice(0,newLen);
    }
    // 逐层调整房间数
    b.floors.forEach((floor,fIdx)=>{
      const newRc=beFloorRooms[fIdx];
      const oldRc=floor.rooms;
      if(newRc<oldRc){
        let hasData=false;
        for(let r=newRc+1;r<=oldRc;r++){
          const key=`${b.id}-${(fIdx+1)*100+r}`;
          if(state.rooms[key]&&state.rooms[key].status!=='empty'){hasData=true;break;}
        }
        if(hasData){
          if(!confirm(`${fIdx+1}层减少房间数将删除多余房间数据，确定继续？`))return;
        }
        for(let r=newRc+1;r<=oldRc;r++){
          const key=`${b.id}-${(fIdx+1)*100+r}`;
          delete state.rooms[key];
        }
      }
      floor.rooms=newRc;
    });
    save();initRooms();renderSidebar();renderAll();
    closeBuildingEdit();toast(name+' 已更新');
  }
}
function deleteBuilding(){
  if(buildingEditMode!=='edit'||!buildingEditId){return;}
  const b=getBuilding(buildingEditId);if(!b)return;
  if(state.buildings.length<=1){toast('至少保留一栋楼');return;}
  if(!confirm(`确定删除${b.name}？该栋所有房间数据将被删除！`))return;
  for(const key in state.rooms){if(key.startsWith(b.id+'-'))delete state.rooms[key];}
  const idx=state.buildings.findIndex(x=>x.id===b.id);
  state.buildings.splice(idx,1);
  if(state.current===b.id)state.current=state.buildings[0].id;
  save();renderSidebar();renderAll();closeBuildingEdit();toast('已删除'+b.name);
}

// 自动判断房间状态：有租客信息或费用记录且非维修中，则自动设为已入住
function autoRoomStatus(room){
  if(room.status==='maintenance')return;
  const hasTenant=room.tenant||room.phone||room.idCard;
  const hasMonths=room.months&&Object.keys(room.months).length>0;
  if(hasTenant||hasMonths){room.status='occupied';}
  else if(room.status==='occupied'){room.status='empty';}
}
function saveRoomQuiet(key){
  const room=state.rooms[key];if(!room)return;
  const fTenant=document.getElementById('fTenant');if(!fTenant)return; // 表单不存在则跳过
  room.tenant=val('fTenant');room.phone=val('fPhone');room.idCard=val('fIdCard');room.moveInDate=val('fDate');
  room.note=val('fNote');room.fixedRent=val('fFixedRent');
  const activePill=document.querySelector('.pill.active');if(activePill)room.status=activePill.dataset.status;
  autoRoomStatus(room);
  room.deposit.amount=val('fDeposit');room.deposit.method=val('fDepositMethod');
  room.updatedAt=new Date().toISOString();save();renderAll();
}
function saveRoom(key){

function doArchiveTenant(key){
  const room=state.rooms[key];
  if(!room.tenant&&!room.phone){toast('该房间无租客可归档');return;}
  // 检查未缴费费用
  let unpaidMonths=[];
  let unpaidTotal=0;
  for(const mym in room.months){
    if(!room.months[mym].paid){
      const c=calcMonthFee(room,room.months[mym]);
      if(c.total>0){unpaidMonths.push(mym);unpaidTotal+=c.total;}
    }
  }
  if(unpaidMonths.length>0){
    if(!confirm(`该租客有 ${unpaidMonths.length} 个月未缴费记录，共欠缴 ¥${unpaidTotal.toFixed(2)}。\n归档后这些欠缴记录仍会保留在"欠缴租金"明细中。\n\n选择"确定"仍归档，选择"取消"返回。`))return;
  }else{
    if(!confirm('确定将当前租客归档？归档后房间将变为空置状态，可入住新租客。\n（房间的固定月租金和单价设置将保留）'))return;
  }
  // 归档对象保存租客的所有信息，包括固定月租金和房间单价
  const archive={
    tenant:room.tenant,phone:room.phone,idCard:room.idCard,idCardImg:room.idCardImg,
    moveInDate:room.moveInDate,leaveDate:new Date().toISOString().slice(0,10),
    deposit:JSON.parse(JSON.stringify(room.deposit)),note:room.note,
    months:JSON.parse(JSON.stringify(room.months)),
    fixedRent:room.fixedRent,  // 保存归档时的固定月租金
    roomRates:JSON.parse(JSON.stringify(room.roomRates))  // 保存归档时的房间单价
  };
  room.archived=room.archived||[];room.archived.unshift(archive);
  // 保留 fixedRent 和 roomRates（租客退租了但费用设置不变，方便新租客入住）
  const def=defaultRoom();
  def.archived=room.archived;
  def.fixedRent=room.fixedRent;  // 保留固定月租金
  def.roomRates=JSON.parse(JSON.stringify(room.roomRates));  // 保留房间单价
  state.rooms[key]=def;
  autoRoomStatus(state.rooms[key]);  // 确保状态自动修正为空置
  save();renderAll();closeSheet();toast('已归档，月租金和单价已保留');
}
